<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRI Breathing Pattern</title>
    <style>
        :root {
            --scale-factor: 1.0;
            --total-cycle: 10s;
            --peak-percent: 50%;
            --bg-base: #001219;
            --bg-pulse: #002b36;
            --accent-teal: #94d2bd;
            --color-in: #00ff88;
            /* Vibrant Green */
            --color-out: #00d1ff;
            /* Electric Blue */
        }

        body {
            background-color: var(--bg-base);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding-top: 60px;
            box-sizing: border-box;
        }

        /* Mirroring Logic */
        .mirror-all {
            transform: scaleX(-1);
        }

        .mirror-patient-only {
            transform: scaleX(-1);
        }

        /* Settings Panel */
        #settings-panel {
            position: fixed;
            top: 70px;
            right: 15px;
            max-height: calc(100vh - 85px);
            overflow-y: auto;
            z-index: 3000;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            transition: all 0.3s ease;
        }

        #settings-panel.collapsed {
            background: transparent;
            border: none;
            padding: 0;
        }

        #settings-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .collapsed #settings-content {
            display: none;
        }

        #settings-toggle {
            cursor: pointer;
            font-size: 24px;
            color: var(--accent-teal);
            display: inline-block;
        }

        /* Timer HUD */
        #top-status {
            position: fixed;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            text-align: center;
            min-width: 300px;
            display: none;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 15px;
        }

        #status-text {
            font-size: 3.5rem;
            font-weight: bold;
            font-family: monospace;
            color: var(--accent-teal);
        }

        #progress-bar-container {
            width: 100%;
            height: 8px;
            background: #111;
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }

        #progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-teal);
            transition: width 1s linear;
        }

        /* Main Viewport */
        #main-viewport {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #pulse-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background-color: color-mix(in srgb, var(--bg-base), var(--bg-pulse) calc(var(--breath-tick, 0) * 100%));
            --instr-scale: 1.0;
        }

        #scaling-wrapper {
            transform: scale(var(--scale-factor));
            transform-origin: top center;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1;
            min-height: 0;
        }

        #patient-content-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 0;
            flex: 1;
        }

        /* Breathing Circle */
        #pulse-circle {
            position: absolute;
            left: 50%;
            top: 50%;
            display: none;
            width: 100%;
            height: 100%;
            max-width: 55vh;
            max-height: 55vh;
            aspect-ratio: 1/1;
            background: radial-gradient(circle, var(--accent-teal) 0%, transparent 75%);
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(calc(0.6 + 0.7 * var(--breath-tick, 0)));
            opacity: calc(var(--breath-tick, 0) * 0.6);
        }

        /* Breathe In/Out Text */
        #breath-text-display {
            position: absolute;
            bottom: 12%;
            font-size: clamp(2rem, 8vmin, 5rem);
            font-weight: 900;
            z-index: 5;
            display: none;
            pointer-events: none;
            text-align: center;
            width: 100%;
            left: 0;
        }

        #breath-text-display.inhale {
            color: var(--color-in);
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
        }

        #breath-text-display.exhale {
            color: var(--color-out);
            text-shadow: 0 0 30px rgba(0, 209, 255, 0.5);
            z-index: 5;
        }

        /* Instruction Area */
        #instruction-input {
            z-index: 10;
            width: 90%;
            background: transparent;
            border: none;
            color: #fff;
            font-size: calc(clamp(2rem, 8vh, 5.5rem) * var(--instr-scale, 1));
            font-weight: 800;
            text-align: center;
            text-transform: uppercase;
            outline: none;
            overflow: hidden;
            display: none;
            margin: 0 auto;
            padding: 0;
            line-height: 1;
            flex-shrink: 0;
        }

        #instruction-input::placeholder {
            color: var(--accent-teal);
            transition: color 0.5s ease;
        }

        #instruction-input.faint::placeholder {
            color: rgba(255, 255, 255, 0.05);
        }

        /* Toolbar */
        #bottom-toolbar {
            background: #050505;
            border-top: 1px solid #222;
            z-index: 2001;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
            flex-shrink: 0;
        }

        .toolbar-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button {
            background: #222;
            color: white;
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        input[type="number"] {
            background: #111;
            color: var(--accent-teal);
            border: 1px solid #444;
            padding: 5px;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
            width: 55px;
        }

        input:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .val-label {
            font-size: 0.7rem;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
    <style id="dynamic-animations"></style>
    <script src="../header.js"></script>
</head>

<body id="main-body">
    <mri-header root="../"></mri-header>

    <div id="settings-panel" class="collapsed">
        <div id="settings-content">
            <div class="control-row"><label>Zoom: </label><select id="zoom-select"
                    onchange="updateScale(this.value)"></select></div>
            <hr style="border:0; border-top:1px solid #333">
            <div class="control-row"><input type="checkbox" id="m-p-check" onchange="toggleMirror('patient')"><label
                    for="m-p-check">Mirror Patient Only</label></div>
            <div class="control-row"><input type="checkbox" id="m-a-check" onchange="toggleMirror('all')"><label
                    for="m-a-check">Mirror Everything</label></div>

            <hr style="border:0; border-top:1px solid #333; margin: 10px 0;">
            <div style="font-size: 0.6rem; color: #666; text-align: center; line-height: 1.4;">
                Tools created by <br>
                <a href="https://www.linkedin.com/in/giuseppepalminteri" target="_blank" style="color:#94d2bd; text-decoration: none; font-weight: bold;">
                    Giuseppe Palminteri
                </a>
            </div>
        </div>
    </div>

    <div id="top-status">
        <div id="status-text">00:00</div>
        <div id="progress-bar-container">
            <div id="progress-bar-fill"></div>
        </div>
    </div>

    <div id="main-viewport">
        <div id="pulse-bg"></div>
        <div id="scaling-wrapper">
            <div id="patient-content-wrapper">
                <div id="pulse-circle"></div>
                <div id="breath-text-display">BREATHE IN</div>
                <textarea id="instruction-input" placeholder="CLICK HERE TO TYPE INSTRUCTIONS" rows="1"></textarea>
            </div>
        </div>
    </div>

    <div id="bottom-toolbar">
        <div class="toolbar-row">
            <div class="tool-group">
                <input type="checkbox" id="instr-check" onchange="toggleInstr()">
                <label for="instr-check" class="val-label" style="text-transform: none;">Text Instructions</label>
            </div>
            <div class="tool-group" id="instr-size-grp" style="opacity: 0.4; pointer-events: none;">
                <span class="val-label">Instr. Size:</span>
                <input type="range" id="instr-size-slider" min="50" max="150" value="100" style="width: 80px;" oninput="changeInstrSize(this.value)">
            </div>
            <div class="tool-group" id="instr-clear-grp" style="opacity: 0.4; pointer-events: none;">
                <button onclick="document.getElementById('instruction-input').value = ''">Clear Text</button>
            </div>
            <div class="tool-group" style="margin-left: 10px; border-left: 1px solid #333; padding-left: 20px;">
                <span class="val-label">Timer:</span>
                <button onclick="startTimer()">Start</button>
                <button style="color:#ff5f5f" onclick="stopAllTimers()">Stop</button>
            </div>
            <div class="tool-group">
                <span class="val-label">Countdown:</span>
                <input type="number" id="cd-min" value="1" min="0" max="99" title="Minutes">
                <span style="color:#666; font-weight:bold;">:</span>
                <input type="number" id="cd-sec" value="00" min="0" max="59" title="Seconds">
                <button onclick="startCountdown()">Start</button>
                <button style="color:#ff5f5f" onclick="stopAllTimers()">Stop</button>
            </div>
        </div>

        <div class="toolbar-row">
            <div class="tool-group">
                <span class="val-label">BPM:</span>
                <input type="number" id="bpm-val" value="6" min="1" step="0.5" onchange="calcBreathing('bpm')">

                <span style="width:10px"></span>

                <input type="checkbox" id="lock-check" checked onchange="toggleLock(this.checked)">
                <label for="lock-check" class="val-label">Lock In/Out</label>

                <span class="val-label">In (s):</span>
                <input type="number" id="in-val" value="5.0" step="0.5" min="0.5" onchange="calcBreathing('in')">

                <span class="val-label">Out (s):</span>
                <input type="number" id="out-val" value="5.0" step="0.5" min="0.5" onchange="calcBreathing('out')">
            </div>

            <div class="tool-group">
                <input type="checkbox" id="pulse-toggle" checked onchange="updatePulseVisibility(this.checked)">
                <label for="pulse-toggle">Pulse</label>

                <input type="checkbox" id="text-toggle" onchange="updateTextVisibility(this.checked)">
                <label for="text-toggle">Text</label>
            </div>
        </div>
    </div>

    <script>
        const inputArea = document.getElementById('instruction-input');
        const body = document.getElementById('main-body');
        const viewport = document.getElementById('main-viewport');
        const patientWrapper = document.getElementById('patient-content-wrapper');
        const breathText = document.getElementById('breath-text-display');
        const pulseCircle = document.getElementById('pulse-circle');
        let textTimer;

        function toggleSettingsPanel() { document.getElementById('settings-panel').classList.toggle('collapsed'); }
        
        function toggleInstr() {
            const isChecked = document.getElementById('instr-check').checked;
            const el = document.getElementById('instruction-input');
            if (el) {
                el.style.display = isChecked ? 'block' : 'none';
                if (isChecked) {
                    el.classList.remove('faint');
                    if (window.instrTimeout) clearTimeout(window.instrTimeout);
                    window.instrTimeout = setTimeout(() => { el.classList.add('faint'); }, 3000);
                    // Force resize to fit placeholder
                    setTimeout(() => {
                        el.style.height = 'auto'; 
                        el.style.height = (el.scrollHeight) + "px";
                    }, 0);
                }
            }
            const clearGrp = document.getElementById('instr-clear-grp');
            if (clearGrp) { clearGrp.style.opacity = isChecked ? '1' : '0.4'; clearGrp.style.pointerEvents = isChecked ? 'auto' : 'none'; }
            const sizeGrp = document.getElementById('instr-size-grp');
            if (sizeGrp) { sizeGrp.style.opacity = isChecked ? '1' : '0.4'; sizeGrp.style.pointerEvents = isChecked ? 'auto' : 'none'; }
        }
        function changeInstrSize(val) {
            document.documentElement.style.setProperty('--instr-scale', val / 100);
            const inputArea = document.getElementById('instruction-input');
            if (inputArea) {
                inputArea.style.height = 'auto'; 
                inputArea.style.height = (inputArea.scrollHeight) + "px";
            }
        }

        inputArea.addEventListener("input", function () { this.style.height = 'auto'; this.style.height = (this.scrollHeight) + "px"; });

        function toggleMirror(type) {
            const cp = document.getElementById('m-p-check');
            const ca = document.getElementById('m-a-check');
            const st = document.getElementById('top-status');
            if (type === 'patient') {
                if (cp.checked) { ca.checked = false; body.classList.remove('mirror-all'); patientWrapper.classList.add('mirror-patient-only'); st.classList.add('mirror-patient-only'); }
                else { patientWrapper.classList.remove('mirror-patient-only'); st.classList.remove('mirror-patient-only'); }
            } else {
                if (ca.checked) { cp.checked = false; patientWrapper.classList.remove('mirror-patient-only'); st.classList.remove('mirror-patient-only'); body.classList.add('mirror-all'); }
                else { body.classList.remove('mirror-all'); }
            }
        }

        // --- BREATHING ENGINE WITH LOCK ---
        function toggleLock(isLocked) {
            document.getElementById('in-val').disabled = isLocked;
            document.getElementById('out-val').disabled = isLocked;
            if (isLocked) calcBreathing('bpm');
        }

        function calcBreathing(changedField) {
            let bpm = parseFloat(document.getElementById('bpm-val').value);
            let inSec = parseFloat(document.getElementById('in-val').value);
            let outSec = parseFloat(document.getElementById('out-val').value);
            const isLocked = document.getElementById('lock-check').checked;

            if (isLocked) {
                // If locked, BPM is master, In and Out are always equal
                let total = 60 / bpm;
                inSec = total / 2;
                outSec = total / 2;
            } else {
                // If unlocked and BPM changed, adjust Out-time to fit
                if (changedField === 'bpm') {
                    let total = 60 / bpm;
                    outSec = total - inSec;
                    if (outSec <= 0) { inSec = total * 0.5; outSec = total * 0.5; }
                } else {
                    // If In or Out changed manually, update BPM to match
                    bpm = 60 / (inSec + outSec);
                }
            }

            document.getElementById('bpm-val').value = bpm.toFixed(1);
            document.getElementById('in-val').value = inSec.toFixed(1);
            document.getElementById('out-val').value = outSec.toFixed(1);

            applySync(bpm, inSec, outSec);
        }

        function applySync(bpm, inSec, outSec) {
            // No longer needed to update CSS variables here
            // The loop will pick up the input values directly
        }

        let breathStartTime = 0;
        let breathReqId = null;

        function updateBreath(now) {
            if (!breathStartTime) breathStartTime = now;
            const elapsed = now - breathStartTime;
            
            const bpm = parseFloat(document.getElementById('bpm-val').value) || 6;
            const inSec = parseFloat(document.getElementById('in-val').value) || 5;
            const outSec = parseFloat(document.getElementById('out-val').value) || 5;
            const totalMs = (inSec + outSec) * 1000;
            
            const cyclePos = elapsed % totalMs;
            const inMs = inSec * 1000;
            
            let tickValue = 0;
            let phase = ""; // "in" or "out"
            
            if (cyclePos < inMs) {
                // Inhale phase: 0 to 1
                tickValue = cyclePos / inMs;
                phase = "in";
            } else {
                // Exhale phase: 1 to 0
                tickValue = 1 - ((cyclePos - inMs) / (totalMs - inMs));
                phase = "out";
            }
            
            // Update visuals via CSS variable
            document.documentElement.style.setProperty('--breath-tick', tickValue.toFixed(4));
            
            // Synchronize text
            const textShown = document.getElementById('text-toggle').checked;
            if (textShown) {
                const newText = (phase === "in") ? "BREATHE IN" : "BREATHE OUT";
                const newClass = (phase === "in") ? "inhale" : "exhale";
                
                if (breathText.innerText !== newText) {
                    breathText.innerText = newText;
                    breathText.className = newClass;
                    breathText.style.display = "block";
                }
            } else {
                breathText.style.display = "none";
            }
            
            breathReqId = requestAnimationFrame(updateBreath);
        }

        function updatePulseVisibility(v) {
            pulseCircle.style.display = v ? 'block' : 'none';
        }

        function updateTextVisibility(v) {
            if (!v) {
                breathText.style.display = 'none';
                breathText.innerText = "";
            }
        }

        // Start the master loop
        requestAnimationFrame(updateBreath);

        // --- TIMER LOGIC ---
        let globalInt; let elapsed = 0;
        const topUI = document.getElementById('top-status');
        const timeText = document.getElementById('status-text');
        const progFill = document.getElementById('progress-bar-fill');

        function stopAllTimers() { 
            clearInterval(globalInt); 
            topUI.style.display = 'none'; 
            document.getElementById('progress-bar-container').style.display = 'none'; 
        }
        function startTimer() {
            stopAllTimers(); 
            elapsed = 0; 
            timeText.innerText = "00:00"; // Flicker fix: Update before display
            topUI.style.display = 'block';
            globalInt = setInterval(() => { 
                elapsed++; 
                let m = Math.floor(elapsed / 60).toString().padStart(2, '0'); 
                let s = (elapsed % 60).toString().padStart(2, '0'); 
                timeText.innerText = `${m}:${s}`; 
            }, 1000);
        }
        function startCountdown() {
            stopAllTimers(); 
            let mins = parseInt(document.getElementById('cd-min').value) || 0;
            let secs = parseInt(document.getElementById('cd-sec').value) || 0;
            let total = (mins * 60) + secs;
            if (total <= 0) return;
            
            let rem = total;
            // Flicker fix: Update before display
            let mInitial = Math.floor(rem / 60).toString().padStart(2, '0');
            let sInitial = (rem % 60).toString().padStart(2, '0');
            timeText.innerText = `${mInitial}:${sInitial}`;
            progFill.style.width = '0%';
            
            topUI.style.display = 'block'; 
            document.getElementById('progress-bar-container').style.display = 'block';
            
            globalInt = setInterval(() => { 
                rem--; 
                let m = Math.floor(rem / 60).toString().padStart(2, '0'); 
                let s = (rem % 60).toString().padStart(2, '0'); 
                timeText.innerText = `${m}:${s}`; 
                progFill.style.width = ((total - rem) / total * 100) + '%'; 
                if (rem <= 0) stopAllTimers(); 
            }, 1000);
        }

        const zs = document.getElementById('zoom-select');
        for (let i = 30; i <= 150; i += 10) { let o = document.createElement('option'); o.value = i / 100; o.innerText = i + '%'; if (i == 100) o.selected = true; zs.appendChild(o); }
        function updateScale(v) { document.documentElement.style.setProperty('--scale-factor', v); document.body.style.overflow = (v > 1) ? 'auto' : 'hidden'; if (v <= 1) window.scrollTo(0, 0); }

        // Initialize at 50/50 lock
        toggleLock(true);
        updatePulseVisibility(true);
    </script>
</body>

</html>
