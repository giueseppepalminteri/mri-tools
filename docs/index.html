<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRI Tools Index</title>
    <link rel="stylesheet" href="styles.css">
    <script src="header.js"></script>
    <style>
        body {
            background-color: #000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .main-menu {
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: center;
        }
        .main-menu a {
            color: #94d2bd;
            font-size: 1.5rem;
            text-decoration: none;
            padding: 15px 30px;
            border: 1px solid #333;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }
        .main-menu a:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
            color: #fff;
        }
    </style>
</head>
<body>
    <mri-header root="./"></mri-header>
    <div class="main-menu">
        <a href="breathing-instructions">Breathing Instructions</a>
        <a href="tmj">TMJ Study</a>
        <a href="tools">Other Tools</a>
    </div>
</body>
</html>
