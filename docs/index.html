<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRI Tools Index</title>
    <link rel="stylesheet" href="styles.css">
    <script src="header.js"></script>
    <style>
        :root {
            --scale-factor: 1.0;
        }
        body {
            background-color: #000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
            padding-top: 60px;
        }
        .main-menu {
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: center;
            width: 300px;
            max-width: 90vw;
            margin: 0 auto;
        }
        .main-menu a {
            color: #94d2bd;
            font-size: 1.5rem;
            text-decoration: none;
            padding: 15px;
            border: 1px solid #333;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
            display: block;
        }
        .main-menu a:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
            color: #fff;
        }
        


        /* --- MIRRORING & SCALING --- */
        .mirror-all {
            transform: scaleX(-1);
        }
        .mirror-patient-active {
            transform: scaleX(-1);
        }
        #scaling-layer {
            transform: scale(var(--scale-factor));
            transform-origin: center center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: calc(100vh - 60px);
        }
        #mirror-layer {
            display: flex;
            justify-content: center;
            width: 100%;
            transition: transform 0.2s ease;
        }
    </style>
</head>
<body id="mainBody">
    <mri-header root="./"></mri-header>

    <div id="settings-panel" class="collapsed">
        <div id="settings-content">
            <div class="control-row">
                <label>Zoom: </label>
                <select id="zoom-select" onchange="updateScale(this.value)"></select>
            </div>
            <hr style="border:0; border-top:1px solid #333">
            <div class="control-row">
                <input type="checkbox" id="m-p-check" onchange="toggleMirror('patient')">
                <label for="m-p-check">Mirror Patient Only</label>
            </div>
            <div class="control-row">
                <input type="checkbox" id="m-a-check" onchange="toggleMirror('all')">
                <label for="m-a-check">Mirror Everything</label>
            </div>
        </div>
    </div>

    <div id="scaling-layer">
        <div id="mirror-layer">
            <div class="main-menu">
                <a href="breathing-instructions">Breathing Instructions</a>
                <a href="tmj">TMJ Study</a>
                <a href="breathing-pattern">Breathing pattern</a>
            </div>
        </div>
    </div>

    <script>
        const scalingLayer = document.getElementById('scaling-layer');
        const mirrorLayer = document.getElementById('mirror-layer');
        const bodyEl = document.getElementById('mainBody');

        function toggleMirror(type) {
            const cp = document.getElementById('m-p-check');
            const ca = document.getElementById('m-a-check');

            if (type === 'patient') {
                if (cp.checked) {
                    ca.checked = false;
                    bodyEl.classList.remove('mirror-all');
                    mirrorLayer.classList.add('mirror-patient-active');
                } else {
                    mirrorLayer.classList.remove('mirror-patient-active');
                }
            } else {
                if (ca.checked) {
                    cp.checked = false;
                    mirrorLayer.classList.remove('mirror-patient-active');
                    bodyEl.classList.add('mirror-all');
                } else {
                    bodyEl.classList.remove('mirror-all');
                }
            }
        }

        const zoomSelect = document.getElementById('zoom-select');
        for (let i = 30; i <= 150; i += 10) {
            let opt = document.createElement('option');
            opt.value = i / 100;
            opt.innerHTML = i + '%';
            if (i === 100) opt.selected = true;
            zoomSelect.appendChild(opt);
        }

        function updateScale(val) {
            document.documentElement.style.setProperty('--scale-factor', val);
        }
    </script>
</body>
</html>
