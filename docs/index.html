<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRI Tools Index</title>
    <link rel="stylesheet" href="styles.css">
    <script src="header.js"></script>
    <style>
        :root {
            --scale-factor: 1.0;
        }
        body {
            background-color: #000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Full-viewport background image */
        #bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            z-index: 0;
        }

        /* --- MIRRORING & SCALING --- */
        .mirror-all {
            transform: scaleX(-1);
        }
        .mirror-patient-active {
            transform: scaleX(-1);
        }

        /* Scaling layer covers the full viewport */
        #scaling-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scale(var(--scale-factor));
            transform-origin: center center;
            z-index: 1;
        }
        #mirror-layer {
            width: 100%;
            height: 100%;
            transition: transform 0.2s ease;
            position: relative;
        }

        /*
         * Menu positioned to match the white screen area in the image.
         * Image native size: 1836x1033
         * Screen TL: x=507, y=258  →  left=27.6%, top=25.0%
         * Screen BR: x=1352, y=561 →  width=46.0%, height=29.3%
         */
        .main-menu {
            position: absolute;
            left: 27.6%;
            top: 25.0%;
            width: 46.0%;
            height: 29.3%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: stretch;
            gap: 6px;
            padding: 10px;
            box-sizing: border-box;
        }
        .main-menu a {
            color: #001219;
            font-size: clamp(0.75rem, 1.8vh, 1.3rem);
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
            display: block;
            text-align: center;
            font-weight: 700;
            border: 1px solid rgba(0, 0, 0, 0.15);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .main-menu a:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: scale(1.03);
            color: #000;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body id="mainBody">
    <mri-header root="./"></mri-header>

    <!-- Background image -->
    <img id="bg-image" src="mri_background.png" alt="MRI Scanner">

    <div id="settings-panel" class="collapsed">
        <div id="settings-content">
            <div class="control-row">
                <label>Zoom: </label>
                <select id="zoom-select" onchange="updateScale(this.value)"></select>
            </div>
            <hr style="border:0; border-top:1px solid #333">
            <div class="control-row">
                <input type="checkbox" id="m-p-check" onchange="toggleMirror('patient')">
                <label for="m-p-check">Mirror Patient Only</label>
            </div>
            <div class="control-row">
                <input type="checkbox" id="m-a-check" onchange="toggleMirror('all')">
                <label for="m-a-check">Mirror Everything</label>
            </div>
        </div>
    </div>

    <div id="scaling-layer">
        <div id="mirror-layer">
            <div class="main-menu">
                <a href="breathing-instructions">Breathing Instructions</a>
                <a href="tmj">TMJ Study</a>
                <a href="breathing-pattern">Breathing pattern</a>
            </div>
        </div>
    </div>

    <script>
        const scalingLayer = document.getElementById('scaling-layer');
        const mirrorLayer = document.getElementById('mirror-layer');
        const bodyEl = document.getElementById('mainBody');

        function toggleMirror(type) {
            const cp = document.getElementById('m-p-check');
            const ca = document.getElementById('m-a-check');

            if (type === 'patient') {
                if (cp.checked) {
                    ca.checked = false;
                    bodyEl.classList.remove('mirror-all');
                    mirrorLayer.classList.add('mirror-patient-active');
                } else {
                    mirrorLayer.classList.remove('mirror-patient-active');
                }
            } else {
                if (ca.checked) {
                    cp.checked = false;
                    mirrorLayer.classList.remove('mirror-patient-active');
                    bodyEl.classList.add('mirror-all');
                } else {
                    bodyEl.classList.remove('mirror-all');
                }
            }
        }

        const zoomSelect = document.getElementById('zoom-select');
        for (let i = 30; i <= 150; i += 10) {
            let opt = document.createElement('option');
            opt.value = i / 100;
            opt.innerHTML = i + '%';
            if (i === 100) opt.selected = true;
            zoomSelect.appendChild(opt);
        }

        function updateScale(val) {
            document.documentElement.style.setProperty('--scale-factor', val);
        }
    </script>
</body>
</html>
