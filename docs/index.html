<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRI Tools Index</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="flex-layout">
    <div class="landing-container">
        <div class="logo-container">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="100%" max-width="400">
                <defs>
                    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00ff88" />
                        <stop offset="100%" stop-color="#00d1ff" />
                    </linearGradient>
                    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="4" result="blur" />
                        <feMerge>
                            <feMergeNode in="blur" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                </defs>
                <g transform="translate(60, 75)" filter="url(#neonGlow)">
                    <ellipse cx="0" cy="0" rx="30" ry="12" fill="none" stroke="url(#glow)" stroke-width="2" transform="rotate(30)" />
                    <ellipse cx="0" cy="0" rx="30" ry="12" fill="none" stroke="url(#glow)" stroke-width="2" transform="rotate(-30)" />
                    <ellipse cx="0" cy="0" rx="30" ry="12" fill="none" stroke="url(#glow)" stroke-width="2" transform="rotate(90)" />
                    <circle cx="0" cy="0" r="6" fill="url(#glow)" />
                </g>
                <text x="120" y="85" font-family="monospace, sans-serif" font-size="32" font-weight="900" fill="#ffffff" letter-spacing="4" filter="url(#neonGlow)">
                    MRI <tspan fill="url(#glow)">TOOLS</tspan>
                </text>
            </svg>
        </div>
        <div class="tool-links">
            <a href="breathing-instructions/" class="tool-link">Breathing Instructions</a>
            <a href="tmj/" class="tool-link">TMJ Study</a>
            <a href="tools/" class="tool-link">Pulse Generator (Tools)</a>
        </div>
    </div>
</body>
</html>
