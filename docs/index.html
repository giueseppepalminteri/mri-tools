<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRI Tools Home</title>
    <style>
        body {
            background-color: #001219;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 120px 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        a.tool-link {
            display: block;
            background: #002b36;
            color: #94d2bd;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 8px;
            border: 1px solid #444;
            font-size: 1.2rem;
            width: 250px;
            text-align: center;
            transition: all 0.2s;
        }
        a.tool-link:hover {
            background: #94d2bd;
            color: #001219;
            transform: scale(1.05);
        }
    </style>
    <script src="header.js"></script>
</head>
<body>
    <mri-header root="./"></mri-header>
    <a class="tool-link" href="breathing-instructions/">Breathing Instructions</a>
    <a class="tool-link" href="tmj/">TMJ Study</a>
    <a class="tool-link" href="tools/">Main Tools</a>
</body>
</html>
