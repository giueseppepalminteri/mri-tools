<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRI Tools Portal</title>
    <script src="header.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: #000;
            display: flex;
            flex-direction: column;
        }
        #tool-container {
            flex-grow: 1;
            border: none;
            width: 100%;
            height: 100%;
            background-color: #000;
        }
        /* Ensure the header from the standalone pages doesn't show when in portal */
        iframe {
            background-color: #000;
        }
    </style>
</head>
<body>
    <mri-header root="./" id="portal-header"></mri-header>
    <iframe id="tool-container" src="home.html" allow="fullscreen"></iframe>

    <script>
        const portalHeader = document.getElementById('portal-header');
        const toolIframe = document.getElementById('tool-container');

        // Handle direct page requests via query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const targetPage = urlParams.get('page');
        if (targetPage) {
            toolIframe.src = targetPage;
            // Clean up the URL in the address bar without reloading
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        // Handle navigation messages from header
        window.addEventListener('message', (event) => {
            if (event.data.type === 'NAVIGATE') {
                toolIframe.src = event.data.url;
            }
        });

        // Update document title and header based on iframe content
        toolIframe.onload = () => {
            try {
                const innerDoc = toolIframe.contentDocument || toolIframe.contentWindow.document;
                const innerWin = toolIframe.contentWindow;
                
                if (innerDoc.title) {
                    document.title = innerDoc.title + " (Portal)";
                    // Update header title display
                    if (portalHeader.shadowRoot) {
                        const titleText = portalHeader.shadowRoot.getElementById('mri-title-text');
                        if (titleText) titleText.textContent = innerDoc.title;
                    }
                }

                // Sync status text if present in the header component
                const pollStatus = () => {
                   if (portalHeader && portalHeader.shadowRoot) {
                       const innerHeader = innerDoc.querySelector('mri-header');
                       // We could sync status text here if needed
                   }
                };
                
            } catch (e) {
                // Cross-origin issues (unlikely since it's local)
            }
        };
    </script>
</body>
</html>
