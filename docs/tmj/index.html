<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMJ MRI Study - Centered Control</title>
    <style>
        :root {
            --scale-factor: 1.0; 
        }

        /* Prevent scrollbars at 100% scale, allow them when zoomed in */
        body {
            background-color: black;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            overflow: auto; 
            background: #000;
        }

        /* Top Left Scale Control */
        #controls-container {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1001;
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(30, 30, 30, 0.85);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
        }

        /* Top Right Navigation Button */
        #exit-domain-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1001;
            background: #700;
            color: white;
            border: 1px solid #a00;
            padding: 10px 18px;
            cursor: pointer;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            transition: background 0.3s;
        }
        #exit-domain-btn:hover { background: #b00; }

        select {
            background: #222;
            color: white;
            border: 1px solid #666;
            padding: 5px;
            cursor: pointer;
            border-radius: 4px;
        }

        /* Main Wrapper for perfect centering */
        #main-viewport {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100vw;
        }

        /* Scaling Wrapper */
        #scaling-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: scale(var(--scale-factor));
            transform-origin: center center; /* Zoom from center for better alignment */
            transition: transform 0.15s ease-out;
            width: 100%;
        }

        /* --- PREVIEW PAGE --- */
        #preview-screen {
            text-align: center;
            width: 90vw;
        }

        .grid-container {
            display: flex;
            gap: 1.5vw;
            justify-content: center;
            margin: 3vh 0;
        }

        .preview-item {
            width: 12vw; 
            background: #111;
            padding: 5px;
            border: 1px solid #333;
            border-radius: 4px;
        }

        .preview-item img {
            width: 100%;
            display: block;
        }

        /* --- PRESENTATION MODE --- */
        #presentation-screen {
            display: none; 
            text-align: center;
            width: 100vw;
            cursor: pointer;
        }

        #instruction-text {
            height: 12vh; /* Fixed height to prevent layout shifts */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6vh; /* Scaled relative to height */
            font-weight: 800;
            color: #ffff00;
            margin-bottom: 2vh;
            padding: 0 5vw;
        }

        #image-display {
            height: 65vh; /* Large enough to be clear, small enough to fit with text */
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #main-img {
            max-width: 95%;
            max-height: 100%;
            border: 4px solid #1a1a1a;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .nav-hint {
            height: 5vh;
            margin-top: 3vh;
            font-size: 2.5vh;
            color: #555;
            font-weight: 600;
        }

        /* Buttons */
        .btn {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 12px 24px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 1rem;
        }

        .start-btn {
            font-size: 1.5rem;
            color: #00ff00;
            border: 2px solid #00ff00;
            background: rgba(0, 255, 0, 0.05);
            padding: 2vh 4vw;
            transition: all 0.3s;
        }
        .start-btn:hover { background: rgba(0, 255, 0, 0.2); }
    </style>
</head>
<body>

    <div id="controls-container">
        <label for="zoom-select">Scale:</label>
        <select id="zoom-select" onchange="updateScale(this.value)">
            </select>
        <button id="home-btn" class="btn" onclick="goHome()" style="display:none; margin-left:10px;">🏠 EXIT PHASE</button>
    </div>

    <a href="../index.html" id="exit-domain-btn">BACK TO INDEX</a>

    <div id="main-viewport">
        <div id="scaling-wrapper">
            <div id="preview-screen">
                <h1 style="font-size: 2.5rem; color: #eee; margin-bottom: 10px;">TMJ SEQUENCE PREVIEW</h1>
                <div class="grid-container">
                    <div class="preview-item"><img src="phase1.jpg"></div>
                    <div class="preview-item"><img src="phase2.jpg"></div>
                    <div class="preview-item"><img src="phase3.jpg"></div>
                    <div class="preview-item"><img src="phase4.jpg"></div>
                    <div class="preview-item"><img src="phase5.jpg"></div>
                    <div class="preview-item"><img src="phase6.jpg"></div>
                </div>
                <button class="btn start-btn" onclick="startPresentation()">START STUDY</button>
            </div>

            <div id="presentation-screen" onclick="handleAdvance()">
                <div id="instruction-text">Mouth Completely Closed</div>
                <div id="image-display">
                    <img id="main-img" src="phase1.jpg">
                </div>
                <div class="nav-hint">CLICK or SPACE: Next | LEFT ARROW: Back</div>
            </div>
        </div>
    </div>

    <script>
        const studyPhases = [
            { img: "phase1.jpg", text: "Mouth Completely Closed" },
            { img: "phase2.jpg", text: "Slightly Open" },
            { img: "phase3.jpg", text: "A Bit More Open" },
            { img: "phase4.jpg", text: "Halfway Open" },
            { img: "phase5.jpg", text: "Open Wide" },
            { img: "phase6.jpg", text: "Maximum Opening" }
        ];

        let currentIdx = 0;
        let isStarted = false;

        const zoomSelect = document.getElementById('zoom-select');
        const previewScreen = document.getElementById('preview-screen');
        const presentationScreen = document.getElementById('presentation-screen');
        const mainImg = document.getElementById('main-img');
        const mainText = document.getElementById('instruction-text');
        const homeBtn = document.getElementById('home-btn');

        // Populate Zoom List (30% to 130%)
        for (let i = 30; i <= 130; i += 10) {
            let opt = document.createElement('option');
            opt.value = i / 100;
            opt.innerHTML = i + '%';
            if (i === 100) opt.selected = true;
            zoomSelect.appendChild(opt);
        }

        function updateScale(val) {
            document.documentElement.style.setProperty('--scale-factor', val);
        }

        function handleAdvance() {
            if (!isStarted) return;
            if (currentIdx === studyPhases.length - 1) {
                goHome();
            } else {
                currentIdx++;
                updateDisplay();
            }
        }

        function handleBack() {
            if (isStarted && currentIdx > 0) {
                currentIdx--;
                updateDisplay();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!isStarted) startPresentation();
                else handleAdvance();
            }
            if (e.code === 'ArrowLeft') {
                e.preventDefault();
                handleBack();
            }
        });

        function startPresentation() {
            currentIdx = 0;
            isStarted = true;
            previewScreen.style.display = 'none';
            presentationScreen.style.display = 'block';
            homeBtn.style.display = 'inline-block';
            updateDisplay();
            window.scrollTo(0,0);
        }

        function goHome() {
            isStarted = false;
            previewScreen.style.display = 'block';
            presentationScreen.style.display = 'none';
            homeBtn.style.display = 'none';
            window.scrollTo(0,0);
        }

        function updateDisplay() {
            mainImg.src = studyPhases[currentIdx].img;
            mainText.innerText = studyPhases[currentIdx].text;
        }
    </script>
</body>
</html>
