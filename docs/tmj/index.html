<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMJ MRI Study Control</title>
    <style>
        :root {
            /* This variable is updated by the dropdown menu */
            --scale-factor: 1.0; 
        }

        body {
            background-color: black;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden; /* Prevents scrollbars during scaling */
        }

        /* Top Left Controls */
        #controls-container {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1000;
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(40, 40, 40, 0.8);
            padding: 8px;
            border-radius: 5px;
        }

        select {
            background: #444;
            color: white;
            border: 1px solid #666;
            padding: 5px;
            cursor: pointer;
        }

        /* Scaling Wrapper - This handles the custom percentage */
        #scaling-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            transform: scale(var(--scale-factor));
            transform-origin: center center;
            transition: transform 0.2s ease-out;
        }

        /* Preview Screen */
        #preview-screen {
            text-align: center;
            width: 95vw;
        }

        .grid-container {
            display: flex;
            gap: 1vw;
            justify-content: center;
            margin: 2vh 0;
        }

        .preview-item {
            width: 14vw;
            background: #111;
            padding: 0.5vw;
            border: 1px solid #333;
        }

        .preview-item img {
            width: 100%;
            display: block;
        }

        /* Presentation Mode */
        #presentation-screen {
            display: none; 
            text-align: center;
            width: 100vw;
            cursor: pointer; /* Indicates the screen is clickable */
        }

        #instruction-text {
            /* Responsive font size based on screen width + scaling */
            font-size: clamp(2rem, 6vw, 5rem); 
            font-weight: 800;
            color: #ffff00;
            margin-bottom: 2vh;
        }

        #image-display {
            height: 60vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #main-img {
            max-width: 90%;
            max-height: 100%;
            border: 0.5vh solid #222;
        }

        .nav-hint {
            margin-top: 3vh;
            font-size: clamp(0.8rem, 2vw, 1.5rem);
            color: #555;
        }

        /* Buttons */
        .btn {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1rem;
        }

        .start-btn {
            font-size: clamp(1rem, 3vw, 2.5rem);
            color: #00ff00;
            border: 2px solid #00ff00;
            background: none;
            padding: 2vh 4vw;
            margin-top: 2vh;
        }
    </style>
</head>
<body>

    <div id="controls-container">
        <label for="zoom-select">Scale:</label>
        <select id="zoom-select" onchange="updateScale(this.value)">
            </select>
        <button id="home-btn" class="btn" onclick="goHome()" style="display:none;">🏠 EXIT</button>
    </div>

    <div id="scaling-wrapper">
        <div id="preview-screen">
            <h1 style="font-size: 3vw; color: #ccc;">TMJ STUDY SEQUENCE PREVIEW</h1>
            <div class="grid-container">
                <div class="preview-item"><img src="phase1.jpg"></div>
                <div class="preview-item"><img src="phase2.jpg"></div>
                <div class="preview-item"><img src="phase3.jpg"></div>
                <div class="preview-item"><img src="phase4.jpg"></div>
                <div class="preview-item"><img src="phase5.jpg"></div>
                <div class="preview-item"><img src="phase6.jpg"></div>
            </div>
            <button class="btn start-btn" onclick="startPresentation()">CLICK OR PRESS SPACE TO START</button>
        </div>

        <div id="presentation-screen" onclick="handleAdvance()">
            <div id="instruction-text">Mouth Completely Closed</div>
            <div id="image-display">
                <img id="main-img" src="phase1.jpg">
            </div>
            <div class="nav-hint">CLICK or SPACE: Next | LEFT ARROW: Back</div>
        </div>
    </div>

    <script>
        const studyPhases = [
            { img: "phase1.jpg", text: "Mouth Completely Closed" },
            { img: "phase2.jpg", text: "Slightly Open" },
            { img: "phase3.jpg", text: "A Bit More Open" },
            { img: "phase4.jpg", text: "Halfway Open" },
            { img: "phase5.jpg", text: "Open Wide" },
            { img: "phase6.jpg", text: "Maximum Opening (Wide Open)" }
        ];

        let currentIdx = 0;
        let isStarted = false;

        // Elements
        const zoomSelect = document.getElementById('zoom-select');
        const previewScreen = document.getElementById('preview-screen');
        const presentationScreen = document.getElementById('presentation-screen');
        const mainImg = document.getElementById('main-img');
        const mainText = document.getElementById('instruction-text');
        const homeBtn = document.getElementById('home-btn');

        // 1. Populate Zoom Dropdown (10% to 200%)
        for (let i = 10; i <= 200; i += 10) {
            let opt = document.createElement('option');
            opt.value = i / 100;
            opt.innerHTML = i + '%';
            if (i === 100) opt.selected = true;
            zoomSelect.appendChild(opt);
        }

        function updateScale(val) {
            document.documentElement.style.setProperty('--scale-factor', val);
        }

        // 2. Navigation Logic
        function handleAdvance() {
            if (!isStarted) return;
            
            if (currentIdx === studyPhases.length - 1) {
                goHome();
            } else {
                currentIdx++;
                updateDisplay();
            }
        }

        function handleBack() {
            if (isStarted && currentIdx > 0) {
                currentIdx--;
                updateDisplay();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!isStarted) startPresentation();
                else handleAdvance();
            }
            if (e.code === 'ArrowLeft') {
                e.preventDefault();
                handleBack();
            }
        });

        function startPresentation() {
            currentIdx = 0;
            isStarted = true;
            previewScreen.style.display = 'none';
            presentationScreen.style.display = 'block';
            homeBtn.style.display = 'block';
            updateDisplay();
        }

        function goHome() {
            isStarted = false;
            previewScreen.style.display = 'block';
            presentationScreen.style.display = 'none';
            homeBtn.style.display = 'none';
        }

        function updateDisplay() {
            mainImg.src = studyPhases[currentIdx].img;
            mainText.innerText = studyPhases[currentIdx].text;
        }
    </script>
</body>
</html>
