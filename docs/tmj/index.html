<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMJ Study</title>
    <style>
        :root {
            --scale-factor: 1.0;
            --accent-teal: #94d2bd;
        }

        body {
            background-color: #000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* --- MIRRORING ENGINE --- */
        /* Mirror Everything (The entire body) */
        .mirror-all {
            transform: scaleX(-1);
        }

        /* Mirror Patient Only (Targeted wrapper) */
        .mirror-patient-active {
            transform: scaleX(-1);
        }

        /* Instruction Area */
        #instruction-input {
            z-index: 1005;
            width: 90%;
            background: transparent;
            border: none;
            color: #fff;
            font-size: calc(clamp(2rem, 8vh, 5.5rem) * var(--instr-scale, 1));
            font-weight: 800;
            text-align: center;
            text-transform: uppercase;
            outline: none;
            resize: none;
            overflow: hidden;
            display: none;
            margin: 0 auto;
            padding: 0;
            line-height: 1;
            flex-shrink: 0;
        }

        #instruction-input::placeholder {
            color: var(--accent-teal);
            transition: color 0.5s ease;
        }

        #instruction-input.faint::placeholder {
            color: rgba(255, 255, 255, 0.05);
        }

        /* --- TOOLBAR STYLES --- */
        #bottom-toolbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            box-sizing: border-box;
            background: #050505;
            border-top: 1px solid #222;
            z-index: 2001;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 15px;
        }
        .toolbar-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }
        .tool-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .val-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }
        input[type="range"] {
            cursor: pointer;
            accent-color: var(--accent-teal);
            width: 150px;
        }

        /* --- SETTINGS PANEL STYLES --- */
        #settings-panel {
            position: fixed;
            top: 70px;
            right: 15px;
            max-height: calc(100vh - 85px);
            overflow-y: auto;
            z-index: 3000;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            transition: all 0.3s ease;
        }

        #settings-panel.collapsed {
            background: transparent;
            border: none;
            padding: 0;
        }

        #settings-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            font-size: 0.8rem;
        }

        .collapsed #settings-content {
            display: none;
        }

        #settings-toggle {
            cursor: pointer;
            font-size: 24px;
            color: var(--accent-teal);
            display: inline-block;
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        select {
            background: #222;
            color: white;
            border: 1px solid #666;
            padding: 4px;
            border-radius: 4px;
        }

        /* --- UI ELEMENTS --- */
        #exit-domain-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1001;
            background: #700;
            color: white;
            border: 1px solid #a00;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
        }

        #main-viewport {
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* SCALE WRAPPER: Handles Zoom */
        #scaling-layer {
            transform: scale(var(--scale-factor));
            transform-origin: top center;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* MIRROR WRAPPER: Handles Patient Flipping */
        #mirror-layer {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease;
        }

        #preview-screen,
        #presentation-screen {
            width: 100%;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
            padding: 10px;
        }

        .grid-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            max-height: 70vh;
            margin: 10px 0;
        }

        .preview-item {
            width: clamp(80px, 15vw, 150px);
            background: #111;
            border: 1px solid #333;
            padding: 5px;
        }

        .preview-item img {
            width: 100%;
            display: block;
        }

        .preview-item.unselected img {
            filter: grayscale(100%);
            opacity: 0.4;
        }

        #instruction-text {
            font-size: clamp(1.2rem, 6vh, 2.5rem);
            font-weight: 800;
            color: #ffff00;
            margin: 5px 0;
            flex-shrink: 0;
        }

        #image-display {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
        }

        #main-img {
            max-height: 100%;
            max-width: 95%;
            object-fit: contain;
            border: 3px solid #333;
        }

        .nav-hint {
            font-size: clamp(0.7rem, 2vh, 1rem);
            color: #666;
            margin: 10px 0;
            flex-shrink: 0;
        }

        .btn {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 6px;
        }

        .start-btn {
            color: #00ff00;
            border-color: #00ff00;
            font-weight: bold;
        }
    </style>
    <script src="../header.js"></script>
</head>

<body id="main-body">
    <mri-header root="../"></mri-header>

    <div id="settings-panel" class="collapsed">
        <div id="settings-content">
            <div class="control-row">
                <label>Zoom: </label>
                <select id="zoom-select" onchange="updateScale(this.value)"></select>
            </div>
            <hr style="border:0; border-top:1px solid #333">
            <div class="control-row">
                <input type="checkbox" id="m-p-check" onchange="toggleMirror('patient')">
                <label for="m-p-check">Mirror Patient Only</label>
            </div>
            <div class="control-row">
                <input type="checkbox" id="m-a-check" onchange="toggleMirror('all')">
                <label for="m-a-check">Mirror Everything</label>
            </div>

            <hr style="border:0; border-top:1px solid #333; margin: 10px 0;">
            <div style="font-size: 0.6rem; color: #666; text-align: center; line-height: 1.4;">
                Tools created by <br>
                <a href="https://www.linkedin.com/in/giuseppepalminteri" target="_blank" style="color:#94d2bd; text-decoration: none; font-weight: bold;">
                    Giuseppe Palminteri
                </a>
            </div>
            <hr style="border:0; border-top:1px solid #333">
            <button id="home-btn" class="btn" onclick="goHome()" style="display:none; width: 100%; padding: 5px;">🏠
                EXIT STUDY</button>
        </div>
    </div>

    <div id="main-viewport">
        <div id="scaling-layer">
            <div id="mirror-layer">
                <textarea id="instruction-input" placeholder="CLICK HERE TO TYPE INSTRUCTIONS" rows="1"></textarea>

                <div id="preview-screen">
                    <h2 style="color: #888; margin: 0;">TMJ STUDY PREVIEW</h2>
                    <div class="grid-container" id="grid-container"></div>
                    <button class="btn start-btn" onclick="startPresentation()">START STUDY</button>
                </div>

                <div id="presentation-screen" style="display:none;" onclick="handleAdvance()">
                    <div id="instruction-text">Mouth Completely Closed</div>
                    <div id="image-display">
                        <img id="main-img" src="phase1.jpg">
                    </div>
                    <div class="nav-hint">CLICK/SPACE: Next | LEFT ARROW: Back</div>
                </div>

            </div>
        </div>
    </div>

    <div id="bottom-toolbar">
        <div class="toolbar-row">
            <div class="tool-group">
                <input type="checkbox" id="instr-check" onchange="toggleInstr()">
                <label for="instr-check" class="val-label" style="text-transform: none; color: #fff;">Text Instructions</label>
            </div>
            <div class="tool-group" id="instr-size-grp" style="opacity: 0.4; pointer-events: none;">
                <span class="val-label" style="color: #fff;">Instr. Size:</span>
                <input type="range" id="instr-size-slider" min="50" max="150" value="100" style="width: 80px;" oninput="changeInstrSize(this.value)">
            </div>
            <div class="tool-group" id="instr-clear-grp" style="opacity: 0.4; pointer-events: none;">
                <button class="btn" style="padding: 5px 12px; font-size: 0.8rem;" onclick="document.getElementById('instruction-input').value = ''">Clear Text</button>
            </div>
        </div>
    </div>

    <script>
        const studyPhases = [
            { img: "phase1.jpg", text: "Mouth Completely Closed" },
            { img: "phase2.jpg", text: "Slightly Open" },
            { img: "phase3.jpg", text: "A Bit More Open" },
            { img: "phase4.jpg", text: "Halfway Open" },
            { img: "phase5.jpg", text: "Open Wide" },
            { img: "phase6.jpg", text: "Maximum Opening" }
        ];

        let currentIdx = 0;
        let isStarted = false;
        let activePhases = [];

        const body = document.getElementById('main-body');
        const mirrorLayer = document.getElementById('mirror-layer');

        function toggleSettingsPanel() { document.getElementById('settings-panel').classList.toggle('collapsed'); }

        function toggleMirror(type) {
            const cp = document.getElementById('m-p-check');
            const ca = document.getElementById('m-a-check');

            if (type === 'patient') {
                if (cp.checked) {
                    ca.checked = false;
                    body.classList.remove('mirror-all');
                    mirrorLayer.classList.add('mirror-patient-active');
                } else {
                    mirrorLayer.classList.remove('mirror-patient-active');
                }
            } else {
                if (ca.checked) {
                    cp.checked = false;
                    mirrorLayer.classList.remove('mirror-patient-active');
                    body.classList.add('mirror-all');
                } else {
                    body.classList.remove('mirror-all');
                }
            }
        }

        // Preview Grid Gen
        const grid = document.getElementById('grid-container');
        studyPhases.forEach((phase, i) => {
            const div = document.createElement('div');
            div.className = 'preview-item';
            div.innerHTML = `
                <img src="${phase.img}" onclick="toggleSelect(${i}, this.parentElement)">
                <label style="font-size: 0.7rem;"><input type="checkbox" class="phase-checkbox" data-index="${i}" checked onchange="updateSelectionStyle(${i}, this.parentElement.parentElement)"> Include</label>
            `;
            grid.appendChild(div);
        });

        // Zoom Populator
        const zoomSelect = document.getElementById('zoom-select');
        for (let i = 30; i <= 150; i += 10) {
            let opt = document.createElement('option');
            opt.value = i / 100;
            opt.innerHTML = i + '%';
            if (i === 100) opt.selected = true;
            zoomSelect.appendChild(opt);
        }

        function toggleSelect(index, el) {
            const cb = el.querySelector('input');
            cb.checked = !cb.checked;
            updateSelectionStyle(index, el);
        }

        function updateSelectionStyle(index, el) {
            const cb = el.querySelector('input');
            el.classList.toggle('unselected', !cb.checked);
        }

        function updateScale(val) {
            document.documentElement.style.setProperty('--scale-factor', val);
        }

        function startPresentation() {
            const cbs = document.querySelectorAll('.phase-checkbox');
            activePhases = [];
            cbs.forEach(cb => {
                if (cb.checked) activePhases.push(studyPhases[cb.dataset.index]);
            });
            if (activePhases.length === 0) return alert('Select at least one image.');
            currentIdx = 0;
            isStarted = true;
            document.getElementById('preview-screen').style.display = 'none';
            document.getElementById('presentation-screen').style.display = 'flex';
            document.getElementById('home-btn').style.display = 'block';
            updateDisplay();
        }

        function goHome() {
            isStarted = false;
            document.getElementById('preview-screen').style.display = 'flex';
            document.getElementById('presentation-screen').style.display = 'none';
            document.getElementById('home-btn').style.display = 'none';
        }

        function updateDisplay() {
            document.getElementById('main-img').src = activePhases[currentIdx].img;
            document.getElementById('instruction-text').innerText = activePhases[currentIdx].text;
        }

        function handleAdvance() {
            if (!isStarted) return;
            if (currentIdx === activePhases.length - 1) goHome();
            else { currentIdx++; updateDisplay(); }
        }

        function handleBack() {
            if (isStarted && currentIdx > 0) { currentIdx--; updateDisplay(); }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') { e.preventDefault(); if (!isStarted) startPresentation(); else handleAdvance(); }
            if (e.code === 'ArrowLeft') handleBack();
            if (e.code === 'ArrowRight') handleAdvance();
        });

        function toggleInstr() {
            const isChecked = document.getElementById('instr-check').checked;
            const el = document.getElementById('instruction-input');
            if (el) {
                el.style.display = isChecked ? 'block' : 'none';
                if (isChecked) {
                    el.classList.remove('faint');
                    if (window.instrTimeout) clearTimeout(window.instrTimeout);
                    window.instrTimeout = setTimeout(() => { el.classList.add('faint'); }, 3000);
                    // Force resize to fit placeholder
                    setTimeout(() => {
                        el.style.height = 'auto'; 
                        el.style.height = (el.scrollHeight) + "px";
                    }, 0);
                }
            }
            const clearGrp = document.getElementById('instr-clear-grp');
            if (clearGrp) { clearGrp.style.opacity = isChecked ? '1' : '0.4'; clearGrp.style.pointerEvents = isChecked ? 'auto' : 'none'; }
            const sizeGrp = document.getElementById('instr-size-grp');
            if (sizeGrp) { sizeGrp.style.opacity = isChecked ? '1' : '0.4'; sizeGrp.style.pointerEvents = isChecked ? 'auto' : 'none'; }
        }
        function changeInstrSize(val) {
            document.documentElement.style.setProperty('--instr-scale', val / 100);
            const inputArea = document.getElementById('instruction-input');
            if (inputArea) {
                inputArea.style.height = 'auto'; 
                inputArea.style.height = (inputArea.scrollHeight) + "px";
            }
        }
        
        const instrArea = document.getElementById('instruction-input');
        if (instrArea) {
            instrArea.addEventListener("input", function () { this.style.height = 'auto'; this.style.height = (this.scrollHeight) + "px"; });
            instrArea.addEventListener('click', e => e.stopPropagation());
            instrArea.addEventListener('keydown', e => {
                if(e.code === 'Space' || e.code === 'ArrowLeft' || e.code === 'ArrowRight') e.stopPropagation();
            });
        }
    </script>
</body>

</html>
