<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMJ MRI Study - Auto-Fit</title>
    <style>
        :root {
            --scale-factor: 1.0; 
        }

        /* Prevent body from scrolling entirely at 100% */
        body {
            background-color: #000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* Top Controls */
        #controls-container {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1001;
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(30, 30, 30, 0.9);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #444;
        }

        #exit-domain-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1001;
            background: #700;
            color: white;
            border: 1px solid #a00;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
        }

        select {
            background: #222;
            color: white;
            border: 1px solid #666;
            padding: 4px;
        }

        /* This container occupies exactly the space between top buttons and screen bottom */
        #main-viewport {
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 60px; /* Room for buttons */
            box-sizing: border-box;
            overflow: hidden; /* Important */
        }

        #scaling-wrapper {
            transform: scale(var(--scale-factor));
            transform-origin: top center; 
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: transform 0.1s ease-out;
        }

        /* Shared Screen Styles */
        #preview-screen, #presentation-screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
            padding: 10px;
        }

        /* --- PREVIEW GRID --- */
        .grid-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
            overflow-y: auto; /* Allow grid to scroll internally if very small screen */
            max-height: 70vh;
            margin: 10px 0;
        }

        .preview-item {
            width: clamp(80px, 15vw, 150px);
            background: #111;
            border: 1px solid #333;
            padding: 5px;
        }

        .preview-item img { width: 100%; display: block; }
        .preview-item.unselected img { filter: grayscale(100%); opacity: 0.4; }

        /* --- PRESENTATION SCREEN --- */
        #instruction-text {
            font-size: clamp(1.2rem, 6vh, 2.5rem); /* Responsive font height */
            font-weight: 800;
            color: #ffff00;
            margin: 5px 0;
            flex-shrink: 0; /* Don't let text get squashed */
        }

        #image-display {
            flex: 1; /* Take all remaining vertical space */
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0; /* Allow the container to shrink */
        }

        #main-img {
            max-height: 100%; /* Fit to the image-display container */
            max-width: 95%;   /* Don't touch screen edges */
            object-fit: contain;
            border: 3px solid #333;
        }

        .nav-hint {
            font-size: clamp(0.7rem, 2vh, 1rem);
            color: #666;
            margin: 5px 0;
            flex-shrink: 0;
        }

        .btn {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 6px;
        }

        .start-btn {
            color: #00ff00;
            border-color: #00ff00;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="controls-container">
        <label for="zoom-select">Scale:</label>
        <select id="zoom-select" onchange="updateScale(this.value)"></select>
        <button id="home-btn" class="btn" onclick="goHome()" style="display:none; padding: 4px 10px;">🏠 EXIT</button>
    </div>

    <a href="../index.html" id="exit-domain-btn">BACK TO INDEX</a>

    <div id="main-viewport">
        <div id="scaling-wrapper">
            
            <div id="preview-screen">
                <h2 style="color: #888; margin: 0;">TMJ STUDY PREVIEW</h2>
                <div class="grid-container" id="grid-container">
                    </div>
                <button class="btn start-btn" onclick="startPresentation()">START STUDY</button>
            </div>

            <div id="presentation-screen" style="display:none;" onclick="handleAdvance()">
                <div id="instruction-text">Mouth Completely Closed</div>
                <div id="image-display">
                    <img id="main-img" src="phase1.jpg">
                </div>
                <div class="nav-hint">CLICK/SPACE: Next | LEFT ARROW: Back</div>
            </div>

        </div>
    </div>

    <script>
        const studyPhases = [
            { img: "phase1.jpg", text: "Mouth Completely Closed" },
            { img: "phase2.jpg", text: "Slightly Open" },
            { img: "phase3.jpg", text: "A Bit More Open" },
            { img: "phase4.jpg", text: "Halfway Open" },
            { img: "phase5.jpg", text: "Open Wide" },
            { img: "phase6.jpg", text: "Maximum Opening" }
        ];

        let currentIdx = 0;
        let isStarted = false;
        let activePhases = [];

        // Generate Preview Grid
        const grid = document.getElementById('grid-container');
        studyPhases.forEach((phase, i) => {
            const div = document.createElement('div');
            div.className = 'preview-item';
            div.innerHTML = `
                <img src="${phase.img}" onclick="toggleSelect(${i}, this.parentElement)">
                <label><input type="checkbox" class="phase-checkbox" data-index="${i}" checked onchange="updateSelectionStyle(${i}, this.parentElement.parentElement)"> Include</label>
            `;
            grid.appendChild(div);
        });

        // Populate Zoom List
        const zoomSelect = document.getElementById('zoom-select');
        for (let i = 30; i <= 150; i += 10) {
            let opt = document.createElement('option');
            opt.value = i / 100;
            opt.innerHTML = i + '%';
            if (i === 100) opt.selected = true;
            zoomSelect.appendChild(opt);
        }

        function toggleSelect(index, el) {
            const cb = el.querySelector('input');
            cb.checked = !cb.checked;
            updateSelectionStyle(index, el);
        }

        function updateSelectionStyle(index, el) {
            const cb = el.querySelector('input');
            el.classList.toggle('unselected', !cb.checked);
        }

        function updateScale(val) {
            document.documentElement.style.setProperty('--scale-factor', val);
            if (val > 1) {
                document.body.style.overflow = 'auto';
            } else {
                document.body.style.overflow = 'hidden';
                window.scrollTo(0,0);
            }
        }

        function startPresentation() {
            const cbs = document.querySelectorAll('.phase-checkbox');
            activePhases = [];
            cbs.forEach(cb => {
                if(cb.checked) activePhases.push(studyPhases[cb.dataset.index]);
            });

            if (activePhases.length === 0) return alert('Select at least one image.');

            currentIdx = 0;
            isStarted = true;
            document.getElementById('preview-screen').style.display = 'none';
            document.getElementById('presentation-screen').style.display = 'flex';
            document.getElementById('home-btn').style.display = 'inline-block';
            updateDisplay();
        }

        function goHome() {
            isStarted = false;
            document.getElementById('preview-screen').style.display = 'flex';
            document.getElementById('presentation-screen').style.display = 'none';
            document.getElementById('home-btn').style.display = 'none';
        }

        function updateDisplay() {
            document.getElementById('main-img').src = activePhases[currentIdx].img;
            document.getElementById('instruction-text').innerText = activePhases[currentIdx].text;
        }

        function handleAdvance() {
            if (!isStarted) return;
            if (currentIdx === activePhases.length - 1) goHome();
            else { currentIdx++; updateDisplay(); }
        }

        function handleBack() {
            if (isStarted && currentIdx > 0) { currentIdx--; updateDisplay(); }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') { e.preventDefault(); if(!isStarted) startPresentation(); else handleAdvance(); }
            if (e.code === 'ArrowLeft') handleBack();
            if (e.code === 'ArrowRight') handleAdvance();
        });
    </script>
</body>
</html>
