<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMJ MRI Study - Fixed Scaling</title>
    <style>
        :root {
            --scale-factor: 1.0; 
        }

        body {
            background-color: black;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            /* Disable scrolling by default, enable only when scaled above 100% */
            overflow: hidden; 
            background: #000;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Left Scale Control */
        #controls-container {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1001;
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(30, 30, 30, 0.9);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
        }

        /* Top Right Navigation Button */
        #exit-domain-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1001;
            background: #700;
            color: white;
            border: 1px solid #a00;
            padding: 10px 18px;
            cursor: pointer;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
        }

        select {
            background: #222;
            color: white;
            border: 1px solid #666;
            padding: 5px;
            cursor: pointer;
        }

        /* Main Viewport: This keeps content centered vertically when small */
        #main-viewport {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Centering happens here */
            align-items: center;
            width: 100%;
            padding: 80px 0; /* Space for fixed buttons */
            box-sizing: border-box;
        }

        /* Scaling Wrapper */
        #scaling-wrapper {
            transform: scale(var(--scale-factor));
            /* Growing from top-center prevents text from being cut off at the top */
            transform-origin: top center; 
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.1s ease-out;
            /* width/height fit-content prevents phantom scrollbars */
            width: fit-content;
            height: fit-content;
        }

        /* --- PREVIEW PAGE (30% Reduced Base) --- */
        #preview-screen {
            text-align: center;
            width: 100%;
            max-width: 90vw; /* Limit width to fit screen */
            margin: 0 auto; /* Center horizontally */
        }

        .grid-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1vw;
            justify-content: center;
            margin: 20px 0;
        }

        .preview-item {
            width: calc(10vw - 1vw); /* Adjusted for gap */
            min-width: 120px; /* Minimum size to prevent too small */
            max-width: 200px; /* Maximum size to prevent too large */
            background: #111;
            padding: 5px;
            border: 1px solid #333;
        }

        .preview-item img {
            width: 100%;
            display: block;
        }

        .preview-item.unselected img {
            filter: grayscale(100%);
        }

        .preview-item label {
            display: block;
            margin-top: 5px;
            font-size: 0.85rem;
            color: #ccc;
            text-align: center;
            cursor: pointer;
        }

        .preview-item input[type="checkbox"] {
            margin-right: 6px;
        }

        /* --- PRESENTATION MODE --- */
        #presentation-screen {
            display: none; 
            text-align: center;
            width: 100vw;
            cursor: pointer;
        }

        #instruction-text {
            font-size: 3rem; /* Fixed base size */
            font-weight: 800;
            color: #ffff00;
            margin-bottom: 20px;
            padding: 0 20px;
        }

        #image-display {
            height: 500px; /* Fixed base height for 100% fit */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #main-img {
            max-height: 100%;
            max-width: 90vw;
            border: 4px solid #222;
        }

        .nav-hint {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #555;
        }

        .btn {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 12px 24px;
            cursor: pointer;
            border-radius: 6px;
        }

        .start-btn {
            font-size: 1.2rem;
            color: #00ff00;
            border: 2px solid #00ff00;
            background: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="controls-container">
        <label for="zoom-select">Scale:</label>
        <select id="zoom-select" onchange="updateScale(this.value)">
            </select>
        <button id="home-btn" class="btn" onclick="goHome()" style="display:none; margin-left:10px;">🏠 EXIT</button>
    </div>

    <a href="../index.html" id="exit-domain-btn">BACK TO INDEX</a>

    <div id="main-viewport">
        <div id="scaling-wrapper">
            <div id="preview-screen">
                <h1 style="color: #ccc;">TMJ STUDY PREVIEW</h1>
                <div class="grid-container">
                    <div class="preview-item">
                        <img src="phase1.jpg">
                        <label><input type="checkbox" class="phase-checkbox" data-index="0" checked> Include</label>
                    </div>
                    <div class="preview-item">
                        <img src="phase2.jpg">
                        <label><input type="checkbox" class="phase-checkbox" data-index="1" checked> Include</label>
                    </div>
                    <div class="preview-item">
                        <img src="phase3.jpg">
                        <label><input type="checkbox" class="phase-checkbox" data-index="2" checked> Include</label>
                    </div>
                    <div class="preview-item">
                        <img src="phase4.jpg">
                        <label><input type="checkbox" class="phase-checkbox" data-index="3" checked> Include</label>
                    </div>
                    <div class="preview-item">
                        <img src="phase5.jpg">
                        <label><input type="checkbox" class="phase-checkbox" data-index="4" checked> Include</label>
                    </div>
                    <div class="preview-item">
                        <img src="phase6.jpg">
                        <label><input type="checkbox" class="phase-checkbox" data-index="5" checked> Include</label>
                    </div>
                </div>
                <button class="btn start-btn" onclick="startPresentation()">START STUDY</button>
            </div>

            <div id="presentation-screen" onclick="handleAdvance()">
                <div id="instruction-text">Mouth Completely Closed</div>
                <div id="image-display">
                    <img id="main-img" src="phase1.jpg">
                </div>
                <div class="nav-hint">CLICK or SPACE: Next | LEFT ARROW: Back</div>
            </div>
        </div>
    </div>

    <script>
        const studyPhases = [
            { img: "phase1.jpg", text: "Mouth Completely Closed" },
            { img: "phase2.jpg", text: "Slightly Open" },
            { img: "phase3.jpg", text: "A Bit More Open" },
            { img: "phase4.jpg", text: "Halfway Open" },
            { img: "phase5.jpg", text: "Open Wide" },
            { img: "phase6.jpg", text: "Maximum Opening" }
        ];

        let currentIdx = 0;
        let isStarted = false;
        let activePhases = studyPhases;

        const zoomSelect = document.getElementById('zoom-select');
        const scalingWrapper = document.getElementById('scaling-wrapper');
        const mainViewport = document.getElementById('main-viewport');
        const previewScreen = document.getElementById('preview-screen');
        const presentationScreen = document.getElementById('presentation-screen');
        const mainImg = document.getElementById('main-img');
        const mainText = document.getElementById('instruction-text');
        const homeBtn = document.getElementById('home-btn');
        const phaseCheckboxes = Array.from(document.querySelectorAll('.phase-checkbox'));

        // Add event listeners to checkboxes to gray out unselected images
        phaseCheckboxes.forEach(cb => {
            cb.addEventListener('change', () => {
                const previewItem = cb.closest('.preview-item');
                if (cb.checked) {
                    previewItem.classList.remove('unselected');
                } else {
                    previewItem.classList.add('unselected');
                }
            });
        });

        // Add event listeners to images to toggle checkboxes
        const previewItems = document.querySelectorAll('.preview-item');
        previewItems.forEach(item => {
            const img = item.querySelector('img');
            const checkbox = item.querySelector('.phase-checkbox');
            img.addEventListener('click', () => {
                checkbox.checked = !checkbox.checked;
                checkbox.dispatchEvent(new Event('change'));
            });
        });

        function getSelectedPhases() {
            return phaseCheckboxes
                .filter(cb => cb.checked)
                .map(cb => studyPhases[Number(cb.dataset.index)]);
        }

        // Populate Zoom List (30% to 130%)
        for (let i = 30; i <= 130; i += 10) {
            let opt = document.createElement('option');
            opt.value = i / 100;
            opt.innerHTML = i + '%';
            if (i === 100) opt.selected = true;
            zoomSelect.appendChild(opt);
        }

        function updateScale(val) {
            document.documentElement.style.setProperty('--scale-factor', val);
            
            // If scale is > 100%, align to top to ensure scrolling works correctly
            if (val > 1) {
                mainViewport.style.justifyContent = 'flex-start';
                document.body.style.overflow = 'auto';
            } else {
                mainViewport.style.justifyContent = 'center';
                document.body.style.overflow = 'hidden';
            }
        }

        function handleAdvance() {
            if (!isStarted) return;
            if (currentIdx === activePhases.length - 1) {
                goHome();
            } else {
                currentIdx++;
                updateDisplay();
            }
        }

        function handleBack() {
            if (isStarted && currentIdx > 0) {
                currentIdx--;
                updateDisplay();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!isStarted) startPresentation();
                else handleAdvance();
            }
            if (e.code === 'ArrowLeft') {
                e.preventDefault();
                handleBack();
            }
        });

        function startPresentation() {
            const selected = getSelectedPhases();
            if (selected.length === 0) {
                alert('Please select at least one image before starting the study.');
                return;
            }

            activePhases = selected;
            currentIdx = 0;
            isStarted = true;
            previewScreen.style.display = 'none';
            presentationScreen.style.display = 'block';
            homeBtn.style.display = 'inline-block';
            updateDisplay();
            window.scrollTo(0,0);
        }

        function goHome() {
            isStarted = false;
            activePhases = studyPhases;
            previewScreen.style.display = 'block';
            presentationScreen.style.display = 'none';
            homeBtn.style.display = 'none';
            window.scrollTo(0,0);
        }

        function updateDisplay() {
            mainImg.src = activePhases[currentIdx].img;
            mainText.innerText = activePhases[currentIdx].text;
        }
    </script>
</body>
</html>
