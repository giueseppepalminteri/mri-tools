<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMJ MRI Study Control</title>
    <style>
        body {
            background-color: black;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Preview Grid */
        #preview-screen {
            text-align: center;
            width: 98%;
        }

        .grid-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 40px 0;
        }

        .preview-item {
            width: 14vw;
            border: 1px solid #333;
            padding: 5px;
            background: #111;
        }

        .preview-item img {
            width: 100%;
            display: block;
        }

        /* Presentation Mode */
        #presentation-screen {
            display: none; 
            text-align: center;
            width: 100%;
            position: relative;
        }

        #instruction-text {
            font-size: 4rem;
            font-weight: 800;
            color: #ffff00;
            margin-bottom: 20px;
        }

        #image-display {
            height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #main-img {
            max-width: 95%;
            max-height: 100%;
            border: 4px solid #222;
        }

        /* Back to Main Button */
        #home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1rem;
            transition: background 0.2s;
        }

        #home-btn:hover {
            background: #555;
        }

        .start-btn {
            font-size: 2rem;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 10px 30px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="preview-screen">
        <h1 style="color: #ccc;">TMJ STUDY SEQUENCE PREVIEW</h1>
        <div class="grid-container">
            <div class="preview-item"><img src="phase1.jpg"><div style="color:#888; margin-top:5px;">1. CLOSED</div></div>
            <div class="preview-item"><img src="phase2.jpg"><div style="color:#888; margin-top:5px;">2. SLIGHT</div></div>
            <div class="preview-item"><img src="phase3.jpg"><div style="color:#888; margin-top:5px;">3. BIT MORE</div></div>
            <div class="preview-item"><img src="phase4.jpg"><div style="color:#888; margin-top:5px;">4. HALFWAY</div></div>
            <div class="preview-item"><img src="phase5.jpg"><div style="color:#888; margin-top:5px;">5. WIDE</div></div>
            <div class="preview-item"><img src="phase6.jpg"><div style="color:#888; margin-top:5px;">6. MAXIMUM</div></div>
        </div>
        <div class="start-btn" onclick="startPresentation()">CLICK OR PRESS SPACE TO START</div>
    </div>

    <div id="presentation-screen">
        <button id="home-btn" onclick="goHome()">🏠 EXIT TO PREVIEW</button>
        <div id="instruction-text">Mouth Completely Closed</div>
        <div id="image-display">
            <img id="main-img" src="phase1.jpg">
        </div>
        <div style="margin-top: 20px; color: #444;">SPACE: Next | LEFT ARROW: Back</div>
    </div>

    <script>
        const studyPhases = [
            { img: "phase1.jpg", text: "Mouth Completely Closed" },
            { img: "phase2.jpg", text: "Slightly Open" },
            { img: "phase3.jpg", text: "A Bit More Open" },
            { img: "phase4.jpg", text: "Halfway Open" },
            { img: "phase5.jpg", text: "Open Wide" },
            { img: "phase6.jpg", text: "Maximum Opening (Wide Open)" }
        ];

        let currentIdx = 0;
        let isStarted = false;

        const previewScreen = document.getElementById('preview-screen');
        const presentationScreen = document.getElementById('presentation-screen');
        const mainImg = document.getElementById('main-img');
        const mainText = document.getElementById('instruction-text');

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!isStarted) {
                    startPresentation();
                } else {
                    // Check if we are at the end of the sequence
                    if (currentIdx === studyPhases.length - 1) {
                        goHome();
                    } else {
                        currentIdx++;
                        updateDisplay();
                    }
                }
            }

            if (e.code === 'ArrowLeft' && isStarted) {
                e.preventDefault();
                if (currentIdx > 0) {
                    currentIdx--;
                    updateDisplay();
                }
            }
        });

        function startPresentation() {
            currentIdx = 0;
            isStarted = true;
            previewScreen.style.display = 'none';
            presentationScreen.style.display = 'block';
            updateDisplay();
        }

        function goHome() {
            isStarted = false;
            previewScreen.style.display = 'block';
            presentationScreen.style.display = 'none';
        }

        function updateDisplay() {
            mainImg.src = studyPhases[currentIdx].img;
            mainText.innerText = studyPhases[currentIdx].text;
        }
    </script>
</body>
</html>
