<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMJ MRI Study Control</title>
    <style>
        :root {
            --scale-factor: 1.0; 
        }

        body {
            background-color: black;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            /* Enabled scrolling for up/down and left/right */
            overflow: auto; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Left Scale Control */
        #controls-container {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1001;
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(40, 40, 40, 0.9);
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #444;
        }

        /* Top Right Navigation Button */
        #exit-domain-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1001;
            background: #900; /* Dark red for distinct exit action */
            color: white;
            border: 1px solid #f00;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 5px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
        }

        select {
            background: #222;
            color: white;
            border: 1px solid #666;
            padding: 5px;
            cursor: pointer;
        }

        /* Scaling Wrapper */
        #scaling-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: fit-content;
            min-width: 100%;
            min-height: 100vh;
            transform: scale(var(--scale-factor));
            /* Transform-origin set to top center to allow scrolling to bottom naturally */
            transform-origin: top center; 
            transition: transform 0.1s ease-out;
            padding: 60px 0; /* Padding so controls don't overlap content */
        }

        /* PREVIEW PAGE (Reduced by 30%) */
        #preview-screen {
            text-align: center;
            width: 95vw;
        }

        .grid-container {
            display: flex;
            gap: 0.7vw; /* Reduced from 1vw */
            justify-content: center;
            margin: 1.4vh 0; /* Reduced from 2vh */
        }

        .preview-item {
            width: 9.8vw; /* Reduced from 14vw (30% reduction) */
            background: #111;
            padding: 0.35vw;
            border: 1px solid #333;
        }

        .preview-item img {
            width: 100%;
            display: block;
        }

        /* PRESENTATION MODE */
        #presentation-screen {
            display: none; 
            text-align: center;
            width: 100vw;
            cursor: pointer;
        }

        #instruction-text {
            /* Font size reduced by 30%: clamp(1.4rem, 4.2vw, 3.5rem) */
            font-size: clamp(1.4rem, 4.2vw, 3.5rem); 
            font-weight: 800;
            color: #ffff00;
            margin-bottom: 1.4vh;
        }

        #image-display {
            height: 42vh; /* Reduced from 60vh (30% reduction) */
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #main-img {
            max-width: 90%;
            max-height: 100%;
            border: 0.35vh solid #222;
        }

        .nav-hint {
            margin-top: 2vh;
            font-size: clamp(0.6rem, 1.4vw, 1rem);
            color: #555;
        }

        .btn {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1rem;
        }

        .start-btn {
            font-size: clamp(0.7rem, 2.1vw, 1.7rem);
            color: #00ff00;
            border: 2px solid #00ff00;
            background: none;
            padding: 1.5vh 3vw;
            margin-top: 1.5vh;
        }
    </style>
</head>
<body>

    <div id="controls-container">
        <label for="zoom-select">Scale:</label>
        <select id="zoom-select" onchange="updateScale(this.value)">
            </select>
        <button id="home-btn" class="btn" onclick="goHome()" style="display:none;">🏠 EXIT PHASE</button>
    </div>

    <a href="../index.html" id="exit-domain-btn">BACK TO INDEX</a>

    <div id="scaling-wrapper">
        <div id="preview-screen">
            <h1 style="font-size: 2.1vw; color: #ccc;">TMJ STUDY SEQUENCE PREVIEW</h1>
            <div class="grid-container">
                <div class="preview-item"><img src="phase1.jpg"></div>
                <div class="preview-item"><img src="phase2.jpg"></div>
                <div class="preview-item"><img src="phase3.jpg"></div>
                <div class="preview-item"><img src="phase4.jpg"></div>
                <div class="preview-item"><img src="phase5.jpg"></div>
                <div class="preview-item"><img src="phase6.jpg"></div>
            </div>
            <button class="btn start-btn" onclick="startPresentation()">CLICK OR PRESS SPACE TO START</button>
        </div>

        <div id="presentation-screen" onclick="handleAdvance()">
            <div id="instruction-text">Mouth Completely Closed</div>
            <div id="image-display">
                <img id="main-img" src="phase1.jpg">
            </div>
            <div class="nav-hint">CLICK or SPACE: Next | LEFT ARROW: Back</div>
        </div>
    </div>

    <script>
        const studyPhases = [
            { img: "phase1.jpg", text: "Mouth Completely Closed" },
            { img: "phase2.jpg", text: "Slightly Open" },
            { img: "phase3.jpg", text: "A Bit More Open" },
            { img: "phase4.jpg", text: "Halfway Open" },
            { img: "phase5.jpg", text: "Open Wide" },
            { img: "phase6.jpg", text: "Maximum Opening (Wide Open)" }
        ];

        let currentIdx = 0;
        let isStarted = false;

        const zoomSelect = document.getElementById('zoom-select');
        const previewScreen = document.getElementById('preview-screen');
        const presentationScreen = document.getElementById('presentation-screen');
        const mainImg = document.getElementById('main-img');
        const mainText = document.getElementById('instruction-text');
        const homeBtn = document.getElementById('home-btn');

        // Populate Zoom Dropdown (30% to 130%)
        for (let i = 30; i <= 130; i += 10) {
            let opt = document.createElement('option');
            opt.value = i / 100;
            opt.innerHTML = i + '%';
            if (i === 100) opt.selected = true;
            zoomSelect.appendChild(opt);
        }

        function updateScale(val) {
            document.documentElement.style.setProperty('--scale-factor', val);
        }

        function handleAdvance() {
            if (!isStarted) return;
            if (currentIdx === studyPhases.length - 1) {
                goHome();
            } else {
                currentIdx++;
                updateDisplay();
            }
        }

        function handleBack() {
            if (isStarted && currentIdx > 0) {
                currentIdx--;
                updateDisplay();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!isStarted) startPresentation();
                else handleAdvance();
            }
            if (e.code === 'ArrowLeft') {
                e.preventDefault();
                handleBack();
            }
        });

        function startPresentation() {
            currentIdx = 0;
            isStarted = true;
            previewScreen.style.display = 'none';
            presentationScreen.style.display = 'block';
            homeBtn.style.display = 'block';
            updateDisplay();
            window.scrollTo(0,0); // Reset scroll position when starting
        }

        function goHome() {
            isStarted = false;
            previewScreen.style.display = 'block';
            presentationScreen.style.display = 'none';
            homeBtn.style.display = 'none';
            window.scrollTo(0,0);
        }

        function updateDisplay() {
            mainImg.src = studyPhases[currentIdx].img;
            mainText.innerText = studyPhases[currentIdx].text;
        }
    </script>
</body>
</html>
