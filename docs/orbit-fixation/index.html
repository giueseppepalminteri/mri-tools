<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRI Orbit Fixation</title>
    <style>
        :root {
            --scale-factor: 1.0;
            --accent-teal: #94d2bd;
            --dot-size: 50px;
            --timer-opacity: 0.3;
            --instr-scale: 0.5;
        }
        body {
            background-color: #000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding-top: 60px;
            box-sizing: border-box;
        }

        /* --- MIRRORING ENGINE --- */
        .mirror-all {
            transform: scaleX(-1);
        }
        .mirror-patient-active {
            transform: scaleX(-1);
        }

        /* --- TOOLBOX STYLES --- */
        #settings-panel {
            position: fixed;
            top: 70px;
            right: 15px;
            z-index: 3000;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            transition: all 0.3s ease;
        }
        #settings-panel.collapsed {
            background: transparent;
            border: none;
            padding: 0;
        }
        #settings-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            font-size: 0.8rem;
        }
        .collapsed #settings-content {
            display: none;
        }

        /* --- VIEWPORT --- */
        #main-viewport {
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Subtle drifting background to prevent Troxler effect */
        #main-viewport::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at center, rgba(148, 210, 189, 0.08) 0%, transparent 65%);
            animation: backgroundDrift 45s infinite alternate ease-in-out;
            z-index: -1;
            pointer-events: none;
        }

        #scaling-layer {
            transform: scale(var(--scale-factor));
            transform-origin: center center;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
            flex: 1;
        }

        #mirror-layer {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s ease;
            min-height: 0;
        }

        /* --- FIXATION STAGE --- */
        .stage {
            position: relative;
            width: clamp(250px, 40vh, 400px);
            height: clamp(250px, 40vh, 400px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .target {
            width: var(--dot-size);
            height: var(--dot-size);
            background-color: var(--accent-teal);
            border-radius: 50%;
            position: relative;
            z-index: 10;
            
            animation: 
                pulse 4s infinite ease-in-out, 
                colorShift 12s infinite linear;
            
            box-shadow: 0 0 25px rgba(148, 210, 189, 0.6);
        }

        .target::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: #000;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .anchor {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
        }
        .top    { top: 0; }
        .bottom { bottom: 0; }
        .left   { left: 0; }
        .right  { right: 0; }

        @keyframes pulse {
            0%, 100% { transform: scale(0.9); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        @keyframes colorShift {
            0%   { background-color: var(--accent-teal); box-shadow: 0 0 25px var(--accent-teal); }
            33%  { background-color: #00ffcc; box-shadow: 0 0 25px #00ffcc; }
            66%  { background-color: #00d1ff; box-shadow: 0 0 25px #00d1ff; }
            100% { background-color: var(--accent-teal); box-shadow: 0 0 25px var(--accent-teal); }
        }

        /* Center HUD for Timer and Instructions */
        #center-hud {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            pointer-events: none;
        }

        #top-status {
            text-align: center;
            min-width: 200px;
            display: none;
            background: none;
            padding: 0;
            border-radius: 0;
            opacity: var(--timer-opacity);
            pointer-events: none;
        }

        /* Instruction Area */
        #instruction-input {
            width: 80%;
            background: transparent;
            border: none;
            color: #fff;
            font-size: calc(clamp(2rem, 8vh, 5.5rem) * var(--instr-scale, 1));
            font-weight: 800;
            text-align: center;
            text-transform: uppercase;
            outline: none;
            resize: none;
            overflow: hidden;
            display: none;
            pointer-events: auto;
            margin: 0 auto;
            padding: 0;
            line-height: 1;
            opacity: var(--timer-opacity);
            flex-shrink: 0;
        }

        #instruction-input::placeholder {
            color: var(--accent-teal);
            transition: color 0.5s ease;
        }

        #instruction-input.faint::placeholder {
            color: rgba(255, 255, 255, 0.05);
        }

        #status-text {
            font-size: 6rem;
            font-weight: 900;
            font-family: monospace;
            color: var(--accent-teal);
            letter-spacing: -2px;
        }

        /* Simplified progress bar for centered HUD */
        #progress-bar-container {
            width: 80px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin: 5px auto 0;
            overflow: hidden;
            display: none;
        }

        #progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-teal);
            transition: width 1s linear;
        }

        /* --- TOOLBAR --- */
        #bottom-toolbar {
            background: #050505;
            border-top: 1px solid #222;
            z-index: 2001;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 15px;
            flex-shrink: 0;
        }
        .toolbar-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }
        .tool-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .val-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }
        button {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
        }
        button:hover {
            background: #333;
            border-color: #666;
        }
        input[type="range"] {
            cursor: pointer;
            accent-color: var(--accent-teal);
            width: 150px;
        }
        input[type="number"] {
            background: #111;
            color: var(--accent-teal);
            border: 1px solid #444;
            width: 55px;
            text-align: center;
            padding: 4px;
            border-radius: 4px;
            font-weight: bold;
        }
        .val-display {
            font-size: 0.8rem;
            color: var(--accent-teal);
            min-width: 40px;
            font-family: monospace;
        }
    </style>
    <script src="../header.js"></script>
</head>
<body id="main-body">
    <mri-header root="../"></mri-header>

    <div id="settings-panel" class="collapsed">
        <div id="settings-content">
            <div class="control-row">
                <label>Zoom: </label>
                <select id="zoom-select" onchange="updateScale(this.value)"></select>
            </div>
            <hr style="border:0; border-top:1px solid #333">
            <div class="control-row">
                <input type="checkbox" id="m-p-check" onchange="toggleMirror('patient')">
                <label for="m-p-check">Mirror Patient Only</label>
            </div>
            <div class="control-row">
                <input type="checkbox" id="m-a-check" onchange="toggleMirror('all')">
                <label for="m-a-check">Mirror Everything</label>
            </div>

            <hr style="border:0; border-top:1px solid #333; margin: 10px 0;">
            <div style="font-size: 0.6rem; color: #666; text-align: center; line-height: 1.4;">
                Tools created by <br>
                <a href="https://www.linkedin.com/in/giuseppepalminteri" target="_blank" style="color:#94d2bd; text-decoration: none; font-weight: bold;">
                    Giuseppe Palminteri
                </a>
            </div>
        </div>
    </div>

    <div id="main-viewport">
        <div id="scaling-layer">
            <div id="mirror-layer">
                <div class="stage" id="stage">
                    <div id="center-hud">
                        <div id="top-status">
                            <div id="status-text">00:00</div>
                            <div id="progress-bar-container">
                                <div id="progress-bar-fill"></div>
                            </div>
                        </div>
                        <textarea id="instruction-input" placeholder="CLICK HERE TO TYPE INSTRUCTIONS" rows="1"></textarea>
                    </div>
                    
                    <div id="fixation-shim" style="display: flex; justify-content: center; align-items: center; width: 100%; height: 100%;">
                        <div id="fixation-target" class="target"></div>
                    </div>

                    <div class="anchor top"></div>
                    <div class="anchor bottom"></div>
                    <div class="anchor left"></div>
                    <div class="anchor right"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="bottom-toolbar">
        <div class="toolbar-row">
            <div class="tool-group" id="instr-clear-grp" style="display: none;">
                <button onclick="document.getElementById('instruction-input').value = ''">Clear Text</button>
            </div>
            <div class="tool-group">
                <input type="checkbox" id="instr-check" onchange="toggleInstr()">
                <label for="instr-check" class="val-label" style="text-transform: none;">Text Instructions</label>
            </div>
            <div class="tool-group" id="instr-size-grp" style="display: none;">
                <span class="val-label">Instr. Size:</span>
                <input type="range" id="instr-size-slider" min="50" max="150" value="50" style="width: 80px;" oninput="changeInstrSize(this.value)">
            </div>
            <div class="tool-group" style="margin-left: 10px; border-left: 1px solid #333; padding-left: 20px;">
                <span class="val-label">Dot Size:</span>
                <input type="range" id="size-slider" min="10" max="150" value="50" oninput="updateDotSize(this.value)">
                <span class="val-display" id="size-display">50px</span>
            </div>
            <div class="tool-group">
                <span class="val-label">Jitter Distance:</span>
                <input type="range" id="jitter-slider" min="0" max="10" step="0.1" value="1.5" oninput="updateJitterDistance(this.value)">
                <span class="val-display" id="jitter-display">1.5px</span>
            </div>
            <div class="tool-group">
                <span class="val-label">Jitter Freq:</span>
                <input type="range" id="freq-slider" min="0.1" max="5" step="0.1" value="1.0" oninput="updateJitterFreq(this.value)">
                <span class="val-display" id="freq-display">1.0 Hz</span>
            </div>
            <button onclick="resetDefaults()" style="margin-left: 20px; border-color: #444; color: #888; font-size: 0.7rem;">Reset Defaults</button>
        </div>
        <div class="toolbar-row">
            <div class="tool-group">
                <span class="val-label">Timer:</span>
                <button onclick="startTimer()">Start</button>
                <button style="color:#ff5f5f" onclick="stopAllTimers()">Stop</button>
            </div>
            <div class="tool-group">
                <span class="val-label">Countdown:</span>
                <input type="number" id="cd-min" value="1" min="0" max="99" title="Minutes">
                <span style="color:#666; font-weight:bold;">:</span>
                <input type="number" id="cd-sec" value="00" min="0" max="59" title="Seconds">
                <button onclick="startCountdown()">Start</button>
                <button style="color:#ff5f5f" onclick="stopAllTimers()">Stop</button>
            </div>
            <div class="tool-group" style="border-left: 1px solid #333; padding-left: 20px;">
                <span class="val-label">Opacity:</span>
                <input type="range" id="opacity-slider" min="0.05" max="0.8" step="0.05" value="0.3" oninput="updateTimerOpacity(this.value)">
                <span class="val-display" id="opacity-display">30%</span>
            </div>
        </div>
    </div>

    <script>
        const body = document.getElementById('main-body');
        const mirrorLayer = document.getElementById('mirror-layer');

        function toggleSettingsPanel() { 
            document.getElementById('settings-panel').classList.toggle('collapsed'); 
        }

        function toggleMirror(type) {
            const cp = document.getElementById('m-p-check');
            const ca = document.getElementById('m-a-check');

            if (type === 'patient') {
                if (cp.checked) {
                    ca.checked = false;
                    body.classList.remove('mirror-all');
                    mirrorLayer.classList.add('mirror-patient-active');
                } else {
                    mirrorLayer.classList.remove('mirror-patient-active');
                }
            } else {
                if (ca.checked) {
                    cp.checked = false;
                    mirrorLayer.classList.remove('mirror-patient-active');
                    body.classList.add('mirror-all');
                } else {
                    body.classList.remove('mirror-all');
                }
            }
        }

        const zoomSelect = document.getElementById('zoom-select');
        for (let i = 30; i <= 200; i += 10) {
            let opt = document.createElement('option');
            opt.value = i / 100;
            opt.innerHTML = i + '%';
            if (i === 100) opt.selected = true;
            zoomSelect.appendChild(opt);
        }

        function updateScale(val) {
            document.documentElement.style.setProperty('--scale-factor', val);
        }

        function updateDotSize(val) {
            document.documentElement.style.setProperty('--dot-size', val + 'px');
            document.getElementById('size-display').innerText = val + 'px';
        }

        let currentDistance = 1.5;
        let currentFreq = 1.0;
        const shimEl = document.getElementById('fixation-shim');

        function updateJitterDistance(val) {
            currentDistance = parseFloat(val);
            document.getElementById('jitter-display').innerText = currentDistance.toFixed(1) + 'px';
        }

        function updateJitterFreq(val) {
            currentFreq = parseFloat(val);
            document.getElementById('freq-display').innerText = currentFreq.toFixed(1) + ' Hz';
        }

        function runJitterLoop(now) {
            let x = 0;
            let y = 0;
            
            if (currentDistance >= 0.1) {
                const omega = 2 * Math.PI * currentFreq;
                const timeSec = now / 1000;
                
                // Use slightly different frequencies for X and Y for a more natural 2D jitter
                x = Math.sin(timeSec * omega) * currentDistance;
                y = Math.cos(timeSec * omega * 1.2) * currentDistance;
            }
            
            if (shimEl) {
                shimEl.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px)`;
            }
            requestAnimationFrame(runJitterLoop);
        }
        
        // Start the loop
        requestAnimationFrame(runJitterLoop);

        function resetDefaults() {
            updateDotSize(50);
            document.getElementById('size-slider').value = 50;
            
            updateJitterDistance(1.5);
            document.getElementById('jitter-slider').value = 1.5;
            
            updateJitterFreq(1.0);
            document.getElementById('freq-slider').value = 1.0;
            
            updateTimerOpacity(0.3);
            document.getElementById('opacity-slider').value = 0.3;
            changeInstrSize(50);
        }

        function updateTimerOpacity(val) {
            document.documentElement.style.setProperty('--timer-opacity', val);
            document.getElementById('opacity-display').innerText = Math.round(val * 100) + '%';
        }

        // --- TIMER LOGIC ---
        let globalInt; let elapsed = 0;
        const topUI = document.getElementById('top-status');
        const timeText = document.getElementById('status-text');
        const progFill = document.getElementById('progress-bar-fill');

        function stopAllTimers() { 
            clearInterval(globalInt); 
            topUI.style.display = 'none'; 
            document.getElementById('progress-bar-container').style.display = 'none'; 
        }
        function startTimer() {
            stopAllTimers(); 
            elapsed = 0; 
            timeText.innerText = "00:00"; // Flicker fix: Update before display
            topUI.style.display = 'block';
            globalInt = setInterval(() => { 
                elapsed++; 
                let m = Math.floor(elapsed / 60).toString().padStart(2, '0'); 
                let s = (elapsed % 60).toString().padStart(2, '0'); 
                timeText.innerText = `${m}:${s}`; 
            }, 1000);
        }
        function startCountdown() {
            stopAllTimers(); 
            let mins = parseInt(document.getElementById('cd-min').value) || 0;
            let secs = parseInt(document.getElementById('cd-sec').value) || 0;
            let total = (mins * 60) + secs;
            if (total <= 0) return;

            let rem = total;
            // Flicker fix: Update before display
            let mInitial = Math.floor(rem / 60).toString().padStart(2, '0');
            let sInitial = (rem % 60).toString().padStart(2, '0');
            timeText.innerText = `${mInitial}:${sInitial}`;
            progFill.style.width = '0%';

            topUI.style.display = 'block'; 
            document.getElementById('progress-bar-container').style.display = 'block';
            globalInt = setInterval(() => { 
                rem--; 
                let m = Math.floor(rem / 60).toString().padStart(2, '0'); 
                let s = (rem % 60).toString().padStart(2, '0'); 
                timeText.innerText = `${m}:${s}`; 
                progFill.style.width = ((total - rem) / total * 100) + '%'; 
                if (rem <= 0) stopAllTimers(); 
            }, 1000);
        }

        function toggleInstr() {
            const isChecked = document.getElementById('instr-check').checked;
            const el = document.getElementById('instruction-input');
            if (el) {
                el.style.display = isChecked ? 'block' : 'none';
                if (isChecked) {
                    el.classList.remove('faint');
                    if (window.instrTimeout) clearTimeout(window.instrTimeout);
                    window.instrTimeout = setTimeout(() => { el.classList.add('faint'); }, 3000);
                    // Force resize to fit placeholder
                    setTimeout(() => {
                        el.style.height = 'auto'; 
                        el.style.height = (el.scrollHeight) + "px";
                    }, 0);
                }
            }
            const clearGrp = document.getElementById('instr-clear-grp');
            if (clearGrp) clearGrp.style.display = isChecked ? 'flex' : 'none';
            const sizeGrp = document.getElementById('instr-size-grp');
            if (sizeGrp) sizeGrp.style.display = isChecked ? 'flex' : 'none';
        }
        function changeInstrSize(val) {
            document.documentElement.style.setProperty('--instr-scale', val / 100);
            const inputArea = document.getElementById('instruction-input');
            if (inputArea) {
                inputArea.style.height = 'auto'; 
                inputArea.style.height = (inputArea.scrollHeight) + "px";
            }
        }
        
        const instrArea = document.getElementById('instruction-input');
        if (instrArea) {
            instrArea.addEventListener("input", function () { this.style.height = 'auto'; this.style.height = (this.scrollHeight) + "px"; });
        }
    </script>
</body>
</html>
