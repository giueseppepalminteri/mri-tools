<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRI Orbit Fixation</title>
    <style>
        :root {
            --scale-factor: 1.0;
            --accent-teal: #94d2bd;
            --dot-size: 50px;
            --jitter-amount: 1px;
        }
        body {
            background-color: #000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding-top: 60px;
            box-sizing: border-box;
        }

        /* --- MIRRORING ENGINE --- */
        .mirror-all {
            transform: scaleX(-1);
        }
        .mirror-patient-active {
            transform: scaleX(-1);
        }

        /* --- TOOLBOX STYLES --- */
        #settings-panel {
            position: fixed;
            top: 70px;
            right: 15px;
            z-index: 3000;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            transition: all 0.3s ease;
        }
        #settings-panel.collapsed {
            background: transparent;
            border: none;
            padding: 0;
        }
        #settings-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            font-size: 0.8rem;
        }
        .collapsed #settings-content {
            display: none;
        }

        /* --- VIEWPORT --- */
        #main-viewport {
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Subtle drifting background to prevent Troxler effect */
        #main-viewport::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at center, rgba(148, 210, 189, 0.08) 0%, transparent 65%);
            animation: backgroundDrift 45s infinite alternate ease-in-out;
            z-index: -1;
            pointer-events: none;
        }

        #scaling-layer {
            transform: scale(var(--scale-factor));
            transform-origin: center center;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #mirror-layer {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s ease;
        }

        /* --- FIXATION STAGE --- */
        .stage {
            position: relative;
            width: clamp(250px, 40vh, 400px);
            height: clamp(250px, 40vh, 400px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .target {
            width: var(--dot-size);
            height: var(--dot-size);
            background-color: var(--accent-teal);
            border-radius: 50%;
            position: relative;
            z-index: 10;
            
            animation: 
                pulse 4s infinite ease-in-out, 
                colorShift 12s infinite linear,
                jitter 0.5s infinite linear;
            
            box-shadow: 0 0 25px rgba(148, 210, 189, 0.6);
        }

        .target::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: #000;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .anchor {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
        }
        .top    { top: 0; }
        .bottom { bottom: 0; }
        .left   { left: 0; }
        .right  { right: 0; }

        @keyframes pulse {
            0%, 100% { transform: scale(0.9); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        @keyframes colorShift {
            0%   { background-color: var(--accent-teal); box-shadow: 0 0 25px var(--accent-teal); }
            33%  { background-color: #00ffcc; box-shadow: 0 0 25px #00ffcc; }
            66%  { background-color: #00d1ff; box-shadow: 0 0 25px #00d1ff; }
            100% { background-color: var(--accent-teal); box-shadow: 0 0 25px var(--accent-teal); }
        }

        @keyframes jitter {
            0% { transform: translate(0,0); }
            25% { transform: translate(var(--jitter-amount), calc(-1 * var(--jitter-amount))); }
            50% { transform: translate(calc(-1 * var(--jitter-amount)), var(--jitter-amount)); }
            75% { transform: translate(var(--jitter-amount), var(--jitter-amount)); }
            100% { transform: translate(0,0); }
        }

        @keyframes backgroundDrift {
            0% { transform: translate(10%, 10%) rotate(0deg); }
            50% { transform: translate(-5%, 5%) rotate(5deg); }
            100% { transform: translate(-10%, -10%) rotate(-5deg); }
        }

        /* --- TOOLBAR --- */
        #bottom-toolbar {
            background: #050505;
            border-top: 1px solid #222;
            z-index: 2001;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            gap: 30px;
        }
        .tool-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .val-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }
        input[type="range"] {
            cursor: pointer;
            accent-color: var(--accent-teal);
            width: 150px;
        }
        .val-display {
            font-size: 0.8rem;
            color: var(--accent-teal);
            min-width: 40px;
            font-family: monospace;
        }
    </style>
    <script src="../header.js"></script>
</head>
<body id="main-body">
    <mri-header root="../"></mri-header>

    <div id="settings-panel" class="collapsed">
        <div id="settings-content">
            <div class="control-row">
                <label>Zoom: </label>
                <select id="zoom-select" onchange="updateScale(this.value)"></select>
            </div>
            <hr style="border:0; border-top:1px solid #333">
            <div class="control-row">
                <input type="checkbox" id="m-p-check" onchange="toggleMirror('patient')">
                <label for="m-p-check">Mirror Patient Only</label>
            </div>
            <div class="control-row">
                <input type="checkbox" id="m-a-check" onchange="toggleMirror('all')">
                <label for="m-a-check">Mirror Everything</label>
            </div>
        </div>
    </div>

    <div id="main-viewport">
        <div id="scaling-layer">
            <div id="mirror-layer">
                <div class="stage" id="stage">
                    <div class="anchor top"></div>
                    <div class="anchor bottom"></div>
                    <div class="anchor left"></div>
                    <div class="anchor right"></div>
                    <div class="target"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="bottom-toolbar">
        <div class="tool-group">
            <span class="val-label">Dot Size:</span>
            <input type="range" id="size-slider" min="10" max="150" value="50" oninput="updateDotSize(this.value)">
            <span class="val-display" id="size-display">50px</span>
        </div>
        <div class="tool-group">
            <span class="val-label">Jitter Intensity:</span>
            <input type="range" id="jitter-slider" min="0" max="10" step="0.5" value="1" oninput="updateJitter(this.value)">
            <span class="val-display" id="jitter-display">1.0px</span>
        </div>
    </div>

    <script>
        const body = document.getElementById('main-body');
        const mirrorLayer = document.getElementById('mirror-layer');

        function toggleSettingsPanel() { 
            document.getElementById('settings-panel').classList.toggle('collapsed'); 
        }

        function toggleMirror(type) {
            const cp = document.getElementById('m-p-check');
            const ca = document.getElementById('m-a-check');

            if (type === 'patient') {
                if (cp.checked) {
                    ca.checked = false;
                    body.classList.remove('mirror-all');
                    mirrorLayer.classList.add('mirror-patient-active');
                } else {
                    mirrorLayer.classList.remove('mirror-patient-active');
                }
            } else {
                if (ca.checked) {
                    cp.checked = false;
                    mirrorLayer.classList.remove('mirror-patient-active');
                    body.classList.add('mirror-all');
                } else {
                    body.classList.remove('mirror-all');
                }
            }
        }

        const zoomSelect = document.getElementById('zoom-select');
        for (let i = 30; i <= 200; i += 10) {
            let opt = document.createElement('option');
            opt.value = i / 100;
            opt.innerHTML = i + '%';
            if (i === 100) opt.selected = true;
            zoomSelect.appendChild(opt);
        }

        function updateScale(val) {
            document.documentElement.style.setProperty('--scale-factor', val);
        }

        function updateDotSize(val) {
            document.documentElement.style.setProperty('--dot-size', val + 'px');
            document.getElementById('size-display').innerText = val + 'px';
        }

        function updateJitter(val) {
            document.documentElement.style.setProperty('--jitter-amount', val + 'px');
            document.getElementById('jitter-display').innerText = parseFloat(val).toFixed(1) + 'px';
        }
    </script>
</body>
</html>
