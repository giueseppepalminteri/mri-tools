<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRI Patient Hub - Final Refinement</title>
    <style>
        :root {
            --scale-factor: 1.0;
            --breath-speed: 5s;
            --bg-base: #001219;
            --bg-pulse: #002b36;
            --accent-teal: #94d2bd;
        }

        body {
            background-color: var(--bg-base);
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        /* Mutual Exclusive Mirroring */
        .mirror-all { transform: scaleX(-1); }
        .mirror-patient-only { transform: scaleX(-1); }

        /* Background Pulse */
        .pulse-active {
            animation: bgPulse var(--breath-speed) ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { background-color: var(--bg-base); }
            50% { background-color: var(--bg-pulse); }
        }

        /* Top Left Controls */
        #top-left-controls {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.85rem;
        }

        .control-row { display: flex; align-items: center; gap: 8px; }

        /* Top Center Timer Display */
        #top-status {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            text-align: center;
            min-width: 300px;
            display: none;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 15px;
        }

        #status-text {
            font-size: 3.5rem;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            color: var(--accent-teal);
        }

        #progress-bar-container {
            width: 100%; height: 8px; background: #111; border-radius: 4px; margin-top: 10px; overflow: hidden; display: none;
        }

        #progress-bar-fill { height: 100%; width: 0%; background: var(--accent-teal); transition: width 1s linear; }

        /* Main Area */
        #main-viewport {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #scaling-wrapper {
            transform: scale(var(--scale-factor));
            transform-origin: top center;
            width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        /* Content for Patient (Flips via Mirror Patient Only) */
        #patient-content-wrapper {
            width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: transform 0.3s ease;
        }

        #pulse-circle {
            position: absolute;
            display: none; /* Initially hidden */
            width: 45vh; height: 45vh;
            background: radial-gradient(circle, var(--accent-teal) 0%, transparent 75%);
            border-radius: 50%;
            z-index: 1;
            animation: circleBreathe var(--breath-speed) ease-in-out infinite;
        }

        @keyframes circleBreathe {
            0%, 100% { transform: scale(0.75); opacity: 0.1; }
            50% { transform: scale(1.15); opacity: 0.4; }
        }

        /* Instruction Input */
        #instruction-input {
            position: relative;
            z-index: 10;
            width: 85%;
            background: transparent;
            border: none;
            color: #fff;
            font-size: clamp(2rem, 8vh, 5rem);
            font-weight: 800;
            text-align: center;
            text-transform: uppercase;
            outline: none;
            resize: none;
            overflow: hidden;
            transition: opacity 0.3s ease;
        }

        /* Placeholder Logic */
        #instruction-input::placeholder {
            color: var(--accent-teal);
            transition: color 1s ease;
        }

        #instruction-input.faint::placeholder {
            color: rgba(255, 255, 255, 0.03); /* Barely visible */
        }

        #instruction-input.faint:hover::placeholder {
            color: rgba(255, 255, 255, 0.3); /* Brighter on hover */
        }

        #instruction-input:not(:placeholder-shown) {
            text-shadow: 0 0 20px rgba(148, 210, 189, 0.5);
        }

        /* Bottom Toolbar */
        #bottom-toolbar {
            background: #050505;
            padding: 12px;
            display: flex; gap: 20px; justify-content: center; align-items: center;
            border-top: 1px solid #222; z-index: 2001; flex-wrap: wrap;
        }

        .tool-group { display: flex; align-items: center; gap: 8px; border-right: 1px solid #333; padding-right: 15px; }
        .tool-group:last-child { border: none; }
        
        button { background: #222; color: white; border: 1px solid #444; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #333; border-color: var(--accent-teal); }
        input[type="number"] { background: #111; color: #fff; border: 1px solid #444; padding: 5px; border-radius: 4px; }
    </style>
</head>
<body id="main-body">

    <div id="top-left-controls">
        <div class="control-row">
            <label>Zoom:</label>
            <select id="zoom-select" onchange="updateScale(this.value)"></select>
        </div>
        <div class="control-row">
            <input type="checkbox" id="mirror-patient-check" onchange="toggleMirror('patient')">
            <label for="mirror-patient-check">Mirror Patient Only</label>
        </div>
        <div class="control-row">
            <input type="checkbox" id="mirror-all-check" onchange="toggleMirror('all')">
            <label for="mirror-all-check">Mirror Everything</label>
        </div>
    </div>

    <div id="top-status">
        <div id="status-text">00:00</div>
        <div id="progress-bar-container">
            <div id="progress-bar-fill"></div>
        </div>
    </div>

    <div id="main-viewport">
        <div id="scaling-wrapper">
            <div id="patient-content-wrapper">
                <div id="pulse-circle"></div>
                <textarea id="instruction-input" placeholder="CLICK HERE TO TYPE INSTRUCTIONS" rows="2"></textarea>
            </div>
        </div>
    </div>

    <div id="bottom-toolbar">
        <div class="tool-group">
            <button onclick="document.getElementById('instruction-input').value = ''">Clear Text</button>
        </div>

        <div class="tool-group">
            <span>Timer:</span>
            <button onclick="startTimer()">Start</button>
            <button style="color:#ff5f5f" onclick="stopAllTimers()">Stop</button>
        </div>

        <div class="tool-group">
            <span>Countdown:</span>
            <input type="number" id="cd-val" value="60" style="width: 50px;">
            <button onclick="startCountdown()">Start</button>
            <button style="color:#ff5f5f" onclick="stopAllTimers()">Stop</button>
        </div>

        <div class="tool-group">
            <input type="checkbox" id="pulse-toggle" onchange="updatePulseVisibility(this.checked)">
            <label for="pulse-toggle">Pulse</label>
            <input type="number" id="breath-val" value="5" step="0.5" onchange="updateBreathSpeed(this.value)" style="width: 45px;">
            <span>Cycle (s)</span>
        </div>
    </div>

    <script>
        const inputArea = document.getElementById('instruction-input');
        const body = document.getElementById('main-body');
        const patientWrapper = document.getElementById('patient-content-wrapper');

        // --- 1. INSTRUCTION TEXT LOGIC ---
        // Initially bright, faint after 3 seconds
        setTimeout(() => {
            inputArea.classList.add('faint');
        }, 3000);

        inputArea.addEventListener("input", function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + "px";
        });

        // --- 2. MIRROR LOGIC (MUTUALLY EXCLUSIVE) ---
        function toggleMirror(type) {
            const checkPatient = document.getElementById('mirror-patient-check');
            const checkAll = document.getElementById('mirror-all-check');
            const statusBox = document.getElementById('top-status');

            if (type === 'patient') {
                if (checkPatient.checked) {
                    checkAll.checked = false;
                    body.classList.remove('mirror-all');
                    patientWrapper.classList.add('mirror-patient-only');
                    statusBox.classList.add('mirror-patient-only');
                } else {
                    patientWrapper.classList.remove('mirror-patient-only');
                    statusBox.classList.remove('mirror-patient-only');
                }
            } else {
                if (checkAll.checked) {
                    checkPatient.checked = false;
                    patientWrapper.classList.remove('mirror-patient-only');
                    statusBox.classList.remove('mirror-patient-only');
                    body.classList.add('mirror-all');
                } else {
                    body.classList.remove('mirror-all');
                }
            }
        }

        // --- 3. PULSE & BREATH LOGIC ---
        function updatePulseVisibility(isVisible) {
            document.getElementById('pulse-circle').style.display = isVisible ? 'block' : 'none';
            body.classList.toggle('pulse-active', isVisible);
        }

        function updateBreathSpeed(val) {
            document.documentElement.style.setProperty('--breath-speed', val + 's');
        }

        // --- 4. TIMER & COUNTDOWN ---
        let globalInt;
        let elapsed = 0;
        const topUI = document.getElementById('top-status');
        const timeText = document.getElementById('status-text');
        const progContainer = document.getElementById('progress-bar-container');
        const progFill = document.getElementById('progress-bar-fill');

        function stopAllTimers() {
            clearInterval(globalInt);
            topUI.style.display = 'none';
            progContainer.style.display = 'none';
        }

        function startTimer() {
            stopAllTimers();
            elapsed = 0;
            topUI.style.display = 'block';
            globalInt = setInterval(() => {
                elapsed++;
                let m = Math.floor(elapsed / 60).toString().padStart(2, '0');
                let s = (elapsed % 60).toString().padStart(2, '0');
                timeText.innerText = `${m}:${s}`;
            }, 1000);
        }

        function startCountdown() {
            stopAllTimers();
            let total = parseInt(document.getElementById('cd-val').value);
            let remaining = total;
            topUI.style.display = 'block';
            progContainer.style.display = 'block';
            
            globalInt = setInterval(() => {
                remaining--;
                let m = Math.floor(remaining / 60).toString().padStart(2, '0');
                let s = (remaining % 60).toString().padStart(2, '0');
                timeText.innerText = `${m}:${s}`;
                progFill.style.width = ((total - remaining) / total * 100) + '%';
                if (remaining <= 0) stopAllTimers();
            }, 1000);
        }

        // --- 5. SCALE LOGIC ---
        const zoomSel = document.getElementById('zoom-select');
        for (let i = 30; i <= 150; i += 10) {
            let opt = document.createElement('option');
            opt.value = i / 100;
            opt.innerText = i + '%';
            if (i === 100) opt.selected = true;
            zoomSel.appendChild(opt);
        }

        function updateScale(val) {
            document.documentElement.style.setProperty('--scale-factor', val);
            document.body.style.overflow = (val > 1) ? 'auto' : 'hidden';
            if (val <= 1) window.scrollTo(0,0);
        }
    </script>
</body>
</html>
