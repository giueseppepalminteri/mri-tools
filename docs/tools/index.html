<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRI Patient Hub - Pro Control</title>
    <style>
        :root {
            --scale-factor: 1.0;
            --breath-speed: 5s;
            --bg-base: #001219;
            --bg-pulse: #002b36;
            --accent-teal: #94d2bd;
        }

        body {
            background-color: var(--bg-base);
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        /* Mirror Classes */
        .mirror-all { transform: scaleX(-1); }
        .mirror-patient { transform: scaleX(-1); }

        /* Background Pulse (Breath Sync) */
        .pulse-active {
            animation: bgPulse var(--breath-speed) ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { background-color: var(--bg-base); }
            50% { background-color: var(--bg-pulse); }
        }

        /* Top Left Controls */
        #controls-container {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.85rem;
        }

        .control-row { display: flex; align-items: center; gap: 10px; }

        /* Top Center Status */
        #top-status {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            text-align: center;
            min-width: 300px;
            display: none;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 15px;
        }

        #status-text {
            font-size: 3.5rem;
            font-weight: bold;
            font-family: monospace;
            color: var(--accent-teal);
        }

        #progress-bar-container {
            width: 100%; height: 10px; background: #111; border-radius: 5px; margin-top: 10px; overflow: hidden;
        }

        #progress-bar-fill { height: 100%; width: 0%; background: var(--accent-teal); transition: width 1s linear; }

        /* Main Viewport */
        #main-viewport {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #scaling-wrapper {
            transform: scale(var(--scale-factor));
            transform-origin: top center;
            width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: transform 0.1s ease-out;
        }

        /* Patient Content Wrapper (This flips for Mirror Content) */
        #patient-content {
            width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: transform 0.3s ease;
        }

        /* Breathing Circle */
        #breathing-element {
            position: absolute;
            display: none; /* Controlled by checkbox */
            width: 40vh; height: 40vh;
            background: radial-gradient(circle, var(--accent-teal) 0%, transparent 75%);
            border-radius: 50%;
            z-index: 1;
            animation: circleBreathe var(--breath-speed) ease-in-out infinite;
        }

        @keyframes circleBreathe {
            0%, 100% { transform: scale(0.7); opacity: 0.1; }
            50% { transform: scale(1.1); opacity: 0.4; }
        }

        /* Textarea and Placeholder Logic */
        #instruction-input {
            position: relative;
            z-index: 10;
            width: 85%;
            background: transparent;
            border: none;
            color: #fff;
            font-size: clamp(2rem, 8vh, 5rem);
            font-weight: 800;
            text-align: center;
            text-transform: uppercase;
            outline: none;
            resize: none;
            overflow: hidden;
            display: none; /* Controlled by checkbox */
        }

        /* Placeholder initial state */
        #instruction-input::placeholder {
            color: rgba(148, 210, 189, 0.8);
            transition: color 2s ease;
        }

        /* Very faint placeholder after 3s (handled via JS class) */
        #instruction-input.faint::placeholder {
            color: rgba(255, 255, 255, 0.03);
        }

        /* Brighter on hover */
        #instruction-input.faint:hover::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        /* Visible text when typed */
        #instruction-input:not(:placeholder-shown) {
            text-shadow: 0 0 20px rgba(148, 210, 189, 0.4);
        }

        /* Bottom Toolbar */
        #bottom-toolbar {
            background: #050505;
            padding: 15px;
            display: flex; gap: 20px; justify-content: center; align-items: center;
            border-top: 1px solid #222; z-index: 2001; flex-wrap: wrap;
        }

        .tool-group { display: flex; align-items: center; gap: 8px; border-right: 1px solid #333; padding-right: 15px; }
        button { background: #222; color: white; border: 1px solid #444; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #333; border-color: var(--accent-teal); }
        input { background: #111; color: #fff; border: 1px solid #444; padding: 6px; border-radius: 4px; }
        .stop-btn { color: #ff5f5f; }
    </style>
</head>
<body>

    <div id="controls-container">
        <div class="control-row">
            <label>Zoom:</label>
            <select id="zoom-select" onchange="updateScale(this.value)"></select>
        </div>
        <div class="control-row">
            <input type="checkbox" id="check-breath" onchange="toggleVisibility('breathing-element', this.checked); toggleBgPulse(this.checked)">
            <label for="check-breath">Show Breath Pulse</label>
        </div>
        <div class="control-row">
            <input type="checkbox" id="check-text" onchange="toggleVisibility('instruction-input', this.checked)">
            <label for="check-text">Show Instructions</label>
        </div>
        <div class="control-row">
            <input type="checkbox" id="flip-patient-check" onchange="mirrorPatient(this.checked)">
            <label for="flip-patient-check">Mirror Content Only</label>
        </div>
        <div class="control-row">
            <input type="checkbox" id="flip-all-check" onchange="mirrorAll(this.checked)">
            <label for="flip-all-check">Mirror Everything</label>
        </div>
    </div>

    <div id="top-status">
        <div id="status-text">00:00</div>
        <div id="progress-bar-container">
            <div id="progress-bar-fill"></div>
        </div>
    </div>

    <div id="main-viewport">
        <div id="scaling-wrapper">
            <div id="patient-content">
                <div id="breathing-element"></div>
                <textarea id="instruction-input" placeholder="CLICK HERE TO TYPE INSTRUCTIONS" rows="2"></textarea>
            </div>
        </div>
    </div>

    <div id="bottom-toolbar">
        <div class="tool-group">
            <span>Timer (Up):</span>
            <button onclick="startTimer()">Start</button>
            <button class="stop-btn" onclick="stopAllTimers()">Stop & Hide</button>
        </div>

        <div class="tool-group">
            <span>Countdown:</span>
            <input type="number" id="cd-input" value="60" style="width: 55px;">
            <button onclick="startCountdown()">Start</button>
            <button class="stop-btn" onclick="stopAllTimers()">Stop & Hide</button>
        </div>

        <div class="tool-group">
            <span>Breath Cycle (s):</span>
            <input type="number" id="breath-val" value="5" step="0.5" onchange="updateBreath(this.value)" style="width: 45px;">
        </div>

        <div class="tool-group" style="border:none;">
            <button onclick="document.getElementById('instruction-input').value = ''">Clear Text</button>
        </div>
    </div>

    <script>
        // --- VISIBILITY & TEXT LOGIC ---
        const inputArea = document.getElementById('instruction-input');
        
        // Faint placeholder logic
        setTimeout(() => {
            inputArea.classList.add('faint');
        }, 3000);

        function toggleVisibility(id, isVisible) {
            document.getElementById(id).style.display = isVisible ? 'block' : 'none';
            if (id === 'instruction-input' && isVisible) inputArea.focus();
        }

        function toggleBgPulse(isActive) {
            document.body.classList.toggle('pulse-active', isActive);
        }

        // --- MIRROR LOGIC ---
        function mirrorPatient(shouldFlip) {
            // Flips status bar and main patient content
            const patientWrapper = document.getElementById('patient-content');
            const status = document.getElementById('top-status');
            patientWrapper.classList.toggle('mirror-patient', shouldFlip);
            status.classList.toggle('mirror-patient', shouldFlip);
        }

        function mirrorAll(shouldFlip) {
            document.body.classList.toggle('mirror-all', shouldFlip);
        }

        // --- SCALING LOGIC ---
        const zoomSelect = document.getElementById('zoom-select');
        for (let i = 30; i <= 150; i += 10) {
            let opt = document.createElement('option');
            opt.value = i / 100;
            opt.innerHTML = i + '%';
            if (i === 100) opt.selected = true;
            zoomSelect.appendChild(opt);
        }

        function updateScale(val) {
            document.documentElement.style.setProperty('--scale-factor', val);
            document.body.style.overflow = (val > 1) ? 'auto' : 'hidden';
            if (val <= 1) window.scrollTo(0,0);
        }

        // --- TIMER & COUNTDOWN LOGIC ---
        let globalInterval;
        let secondsCounter = 0;
        const topDisplay = document.getElementById('top-status');
        const statusText = document.getElementById('status-text');
        const progressFill = document.getElementById('progress-bar-fill');

        function stopAllTimers() {
            clearInterval(globalInterval);
            topDisplay.style.display = 'none';
            document.getElementById('progress-bar-container').style.display = 'none';
        }

        function startTimer() {
            stopAllTimers();
            secondsCounter = 0;
            topDisplay.style.display = 'block';
            globalInterval = setInterval(() => {
                secondsCounter++;
                let m = Math.floor(secondsCounter / 60).toString().padStart(2, '0');
                let s = (secondsCounter % 60).toString().padStart(2, '0');
                statusText.innerText = `${m}:${s}`;
            }, 1000);
        }

        function startCountdown() {
            stopAllTimers();
            let duration = parseInt(document.getElementById('cd-input').value);
            let timeLeft = duration;
            topDisplay.style.display = 'block';
            document.getElementById('progress-bar-container').style.display = 'block';
            
            globalInterval = setInterval(() => {
                timeLeft--;
                let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
                let s = (timeLeft % 60).toString().padStart(2, '0');
                statusText.innerText = `${m}:${s}`;
                progressFill.style.width = ((duration - timeLeft) / duration * 100) + '%';
                if (timeLeft <= 0) stopAllTimers();
            }, 1000);
        }

        function updateBreath(val) {
            document.documentElement.style.setProperty('--breath-speed', val + 's');
        }

        // Auto-resize typing area
        inputArea.addEventListener("input", function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + "px";
        });
    </script>
</body>
</html>
