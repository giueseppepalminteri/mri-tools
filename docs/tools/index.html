<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRI Patient Hub - Keyboard Input</title>
    <style>
        :root {
            --scale-factor: 1.0;
            --breath-speed: 5s; /* Frequency */
            --bg-base: #001219;
            --bg-pulse: #002b36;
            --accent-teal: #94d2bd;
        }

        body {
            background-color: var(--bg-base);
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            /* The whole screen pulses in intensity */
            animation: bgPulse var(--breath-speed) ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { background-color: var(--bg-base); }
            50% { background-color: var(--bg-pulse); }
        }

        /* Top Left Scale */
        #zoom-container {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #444;
        }

        /* Top Center Status (Hidden by default) */
        #top-status {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            text-align: center;
            min-width: 300px;
            display: none; /* Removed when not in use */
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 15px;
        }

        #status-text {
            font-size: 3.5rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            color: var(--accent-teal);
            text-shadow: 0 0 15px rgba(148, 210, 189, 0.6);
        }

        #progress-bar-container {
            width: 100%;
            height: 10px;
            background: #111;
            border-radius: 5px;
            margin-top: 10px;
            display: none;
            overflow: hidden;
        }

        #progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-teal);
            transition: width 1s linear;
        }

        /* Main Area */
        #main-viewport {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #scaling-wrapper {
            transform: scale(var(--scale-factor));
            transform-origin: top center;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s ease-out;
        }

        /* Breathing Circle */
        #pulse-circle {
            position: absolute;
            width: 40vh;
            height: 40vh;
            background: radial-gradient(circle, var(--accent-teal) 0%, transparent 75%);
            border-radius: 50%;
            z-index: 1;
            animation: circleBreathe var(--breath-speed) ease-in-out infinite;
        }

        @keyframes circleBreathe {
            0%, 100% { transform: scale(0.7); opacity: 0.1; }
            50% { transform: scale(1.1); opacity: 0.4; }
        }

        /* Interactive Text Area */
        #instruction-input {
            position: relative;
            z-index: 10;
            width: 80%;
            background: transparent;
            border: none;
            color: #fff;
            font-size: clamp(2rem, 8vh, 5rem);
            font-weight: 800;
            text-align: center;
            text-transform: uppercase;
            outline: none;
            cursor: text;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            resize: none;
            overflow: hidden;
        }

        #instruction-input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        /* Bottom Toolbar */
        #bottom-toolbar {
            background: #050505;
            padding: 15px;
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            border-top: 1px solid #222;
            z-index: 2001;
            flex-wrap: wrap;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 8px;
            border-right: 1px solid #333;
            padding-right: 15px;
        }

        button {
            background: #222;
            color: white;
            border: 1px solid #444;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover { background: #333; border-color: var(--accent-teal); }
        input { background: #111; color: #fff; border: 1px solid #444; padding: 6px; border-radius: 4px; }
        
        .active-timer { color: var(--accent-teal); border-color: var(--accent-teal); box-shadow: 0 0 10px rgba(148, 210, 189, 0.3); }
        .stop-btn { color: #ff5f5f; border-color: #444; }
    </style>
</head>
<body>

    <div id="zoom-container">
        <label>Zoom: </label>
        <select id="zoom-select" onchange="updateScale(this.value)"></select>
    </div>

    <div id="top-status">
        <div id="status-text">00:00</div>
        <div id="progress-bar-container">
            <div id="progress-bar-fill"></div>
        </div>
    </div>

    <div id="main-viewport">
        <div id="scaling-wrapper">
            <div id="pulse-circle"></div>
            <textarea id="instruction-input" placeholder="CLICK HERE TO TYPE INSTRUCTIONS" rows="2"></textarea>
        </div>
    </div>

    <div id="bottom-toolbar">
        <div class="tool-group">
            <span>Timer (Up):</span>
            <button id="timer-start" onclick="startTimer()">Start</button>
            <button class="stop-btn" onclick="stopAllTimers()">Stop & Hide</button>
        </div>

        <div class="tool-group">
            <span>Countdown:</span>
            <input type="number" id="cd-input" value="60" style="width: 60px;">
            <button id="cd-start" onclick="startCountdown()">Start</button>
            <button class="stop-btn" onclick="stopAllTimers()">Stop & Hide</button>
        </div>

        <div class="tool-group">
            <span>Breath Cycle (s):</span>
            <input type="number" id="breath-val" value="5" step="0.5" onchange="updateBreath(this.value)" style="width: 50px;">
        </div>

        <div class="tool-group" style="border:none;">
            <button onclick="document.getElementById('instruction-input').value = ''">Clear Text</button>
        </div>
    </div>

    <script>
        // --- SCALING LOGIC ---
        const zoomSelect = document.getElementById('zoom-select');
        for (let i = 30; i <= 150; i += 10) {
            let opt = document.createElement('option');
            opt.value = i / 100;
            opt.innerHTML = i + '%';
            if (i === 100) opt.selected = true;
            zoomSelect.appendChild(opt);
        }

        function updateScale(val) {
            document.documentElement.style.setProperty('--scale-factor', val);
            document.body.style.overflow = (val > 1) ? 'auto' : 'hidden';
            if (val <= 1) window.scrollTo(0,0);
        }

        // --- TIMER & COUNTDOWN LOGIC ---
        let globalInterval;
        let secondsCounter = 0;
        const topDisplay = document.getElementById('top-status');
        const statusText = document.getElementById('status-text');
        const progressContainer = document.getElementById('progress-bar-container');
        const progressFill = document.getElementById('progress-bar-fill');

        function formatTime(s) {
            const m = Math.floor(s / 60).toString().padStart(2, '0');
            const sec = (s % 60).toString().padStart(2, '0');
            return `${m}:${sec}`;
        }

        function stopAllTimers() {
            clearInterval(globalInterval);
            topDisplay.style.display = 'none';
            progressContainer.style.display = 'none';
            document.getElementById('timer-start').classList.remove('active-timer');
            document.getElementById('cd-start').classList.remove('active-timer');
        }

        function startTimer() {
            stopAllTimers();
            secondsCounter = 0;
            topDisplay.style.display = 'block';
            statusText.innerText = "00:00";
            document.getElementById('timer-start').classList.add('active-timer');

            globalInterval = setInterval(() => {
                secondsCounter++;
                statusText.innerText = formatTime(secondsCounter);
            }, 1000);
        }

        function startCountdown() {
            stopAllTimers();
            let duration = parseInt(document.getElementById('cd-input').value);
            let timeLeft = duration;
            
            topDisplay.style.display = 'block';
            progressContainer.style.display = 'block';
            statusText.innerText = formatTime(timeLeft);
            progressFill.style.width = '0%';
            document.getElementById('cd-start').classList.add('active-timer');

            globalInterval = setInterval(() => {
                timeLeft--;
                statusText.innerText = formatTime(timeLeft);
                let percent = ((duration - timeLeft) / duration) * 100;
                progressFill.style.width = percent + '%';

                if (timeLeft <= 0) {
                    stopAllTimers();
                    topDisplay.style.display = 'block';
                    statusText.innerText = "COMPLETE";
                    setTimeout(() => { topDisplay.style.display = 'none'; }, 3000);
                }
            }, 1000);
        }

        // --- BREATHING LOGIC ---
        function updateBreath(val) {
            document.documentElement.style.setProperty('--breath-speed', val + 's');
        }

        // --- TEXTAREA AUTO-RESIZE ---
        const tx = document.getElementById('instruction-input');
        tx.addEventListener("input", OnInput, false);
        function OnInput() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + "px";
        }
    </script>
</body>
</html>
