<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRI Patient Hub - Clinical Sync</title>
    <style>
        :root {
            --scale-factor: 1.0;
            --total-cycle: 10s;
            --peak-percent: 40%; 
            --bg-base: #001219;
            --bg-pulse: #002b36;
            --accent-teal: #94d2bd;
            --highlight-yellow: #ffff00;
        }

        body {
            background-color: var(--bg-base);
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 0;
            height: 100vh; width: 100vw;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* Mirroring Logic */
        .mirror-all { transform: scaleX(-1); }
        .mirror-patient-only { transform: scaleX(-1); }

        /* Animation Classes */
        .pulse-active { animation: bgPulse var(--total-cycle) linear infinite; }

        /* Settings Panel (Collapsible) */
        #settings-panel {
            position: fixed; top: 15px; left: 15px; z-index: 3000;
            background: rgba(0, 0, 0, 0.9); border: 1px solid #444;
            border-radius: 8px; padding: 10px; transition: all 0.3s ease;
        }
        #settings-panel.collapsed { background: transparent; border: none; padding: 0; }
        #settings-content { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .collapsed #settings-content { display: none; }
        #settings-toggle { cursor: pointer; font-size: 24px; color: var(--accent-teal); display: inline-block; }

        /* Timer HUD */
        #top-status {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 2000; text-align: center; min-width: 300px;
            display: none; background: rgba(0, 0, 0, 0.4); padding: 10px; border-radius: 15px;
        }
        #status-text { font-size: 3.5rem; font-weight: bold; font-family: monospace; color: var(--accent-teal); }
        #progress-bar-container { width: 100%; height: 8px; background: #111; border-radius: 4px; margin-top: 10px; overflow: hidden; display: none; }
        #progress-bar-fill { height: 100%; width: 0%; background: var(--accent-teal); transition: width 1s linear; }

        /* Main Viewport */
        #main-viewport { flex: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #scaling-wrapper {
            transform: scale(var(--scale-factor)); transform-origin: top center;
            width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #patient-content-wrapper {
            width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative;
        }

        /* Breathing Pulse & Text */
        #pulse-circle {
            position: absolute; display: none; width: 55vh; height: 55vh;
            background: radial-gradient(circle, var(--accent-teal) 0%, transparent 75%);
            border-radius: 50%; z-index: 1;
        }
        .animating #pulse-circle { animation: clinicalBreathe var(--total-cycle) linear infinite; }

        #breath-text-display {
            position: absolute; bottom: 12%; font-size: 5.5rem; font-weight: 900;
            color: var(--highlight-yellow); text-shadow: 0 0 30px rgba(255, 255, 0, 0.6), 0 0 10px rgba(0,0,0,1);
            z-index: 2; display: none; pointer-events: none; text-align: center; width: 100%; transition: opacity 0.3s ease;
        }

        /* Instruction Area */
        #instruction-input {
            z-index: 10; width: 90%; background: transparent; border: none;
            color: #fff; font-size: clamp(2rem, 8vh, 5.5rem); font-weight: 800;
            text-align: center; text-transform: uppercase; outline: none; resize: none; overflow: hidden;
        }
        #instruction-input::placeholder { color: var(--accent-teal); transition: color 1s ease; }
        #instruction-input.faint::placeholder { color: rgba(255, 255, 255, 0.03); }
        #instruction-input.faint:hover::placeholder { color: rgba(255, 255, 255, 0.3); }

        /* TWO-ROW BOTTOM TOOLBAR */
        #bottom-toolbar {
            background: #050505; border-top: 1px solid #222; z-index: 2001;
            display: flex; flex-direction: column; padding: 10px; gap: 10px;
        }
        .toolbar-row { display: flex; justify-content: center; align-items: center; gap: 25px; }
        .tool-group { display: flex; align-items: center; gap: 8px; }
        
        button { background: #222; color: white; border: 1px solid #444; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        input[type="number"] { background: #111; color: #fff; border: 1px solid #444; padding: 5px; border-radius: 4px; font-weight: bold; text-align: center; }
        .val-label { font-size: 0.75rem; color: #777; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Specific input widths */
        #bpm-val, #in-val, #out-val { width: 50px; border-color: #333; color: var(--accent-teal); }
    </style>
</head>
<body id="main-body">

    <div id="settings-panel" class="collapsed">
        <span id="settings-toggle" onclick="toggleSettingsPanel()">⚙️</span>
        <div id="settings-content">
            <div class="control-row"><label>Zoom: </label><select id="zoom-select" onchange="updateScale(this.value)"></select></div>
            <hr style="border:0; border-top:1px solid #333">
            <div class="control-row"><input type="checkbox" id="m-p-check" onchange="toggleMirror('patient')"><label for="m-p-check">Mirror Patient Only</label></div>
            <div class="control-row"><input type="checkbox" id="m-a-check" onchange="toggleMirror('all')"><label for="m-a-check">Mirror Everything</label></div>
        </div>
    </div>

    <div id="top-status">
        <div id="status-text">00:00</div>
        <div id="progress-bar-container"><div id="progress-bar-fill"></div></div>
    </div>

    <div id="main-viewport">
        <div id="scaling-wrapper">
            <div id="patient-content-wrapper">
                <div id="pulse-circle"></div>
                <div id="breath-text-display">BREATHE IN</div>
                <textarea id="instruction-input" placeholder="CLICK HERE TO TYPE INSTRUCTIONS" rows="2"></textarea>
            </div>
        </div>
    </div>

    <div id="bottom-toolbar">
        <div class="toolbar-row">
            <div class="tool-group"><button onclick="document.getElementById('instruction-input').value = ''">Clear Text</button></div>
            <div class="tool-group">
                <span class="val-label">Timer (Up):</span>
                <button onclick="startTimer()">Start</button>
                <button style="color:#ff5f5f" onclick="stopAllTimers()">Stop</button>
            </div>
            <div class="tool-group">
                <span class="val-label">Countdown:</span>
                <input type="number" id="cd-val" value="60" style="width: 55px;">
                <button onclick="startCountdown()">Start</button>
                <button style="color:#ff5f5f" onclick="stopAllTimers()">Stop</button>
            </div>
        </div>

        <div class="toolbar-row">
            <div class="tool-group">
                <span class="val-label">BPM:</span>
                <input type="number" id="bpm-val" value="6" min="1" onchange="calcBreathing('bpm')">
                
                <span class="val-label">In (s):</span>
                <input type="number" id="in-val" value="4" step="0.5" min="0.5" onchange="calcBreathing('in')">
                
                <span class="val-label">Out (s):</span>
                <input type="number" id="out-val" value="6" step="0.5" min="0.5" onchange="calcBreathing('out')">
                
                <input type="checkbox" id="split-io" onchange="toggleSplitIO(this.checked)">
                <label for="split-io">Split In/Out</label>
            </div>

            <div class="tool-group">
                <input type="checkbox" id="pulse-toggle" onchange="updatePulseVisibility(this.checked)">
                <label for="pulse-toggle">Pulse</label>
                
                <input type="checkbox" id="text-toggle" onchange="updateTextVisibility(this.checked)">
                <label for="text-toggle">Text</label>
            </div>
        </div>
    </div>

    <script>
        const inputArea = document.getElementById('instruction-input');
        const body = document.getElementById('main-body');
        const patientWrapper = document.getElementById('patient-content-wrapper');
        const breathText = document.getElementById('breath-text-display');
        const pulseCircle = document.getElementById('pulse-circle');
        let breathAnimFrame = null;
        let cycleStart = performance.now();
        let lastTotal = 0;
        let splitInOut = false;

        function toggleSplitIO(checked) {
            splitInOut = checked;
            if (!splitInOut) {
                // When locking, make in/out equal and recalculate BPM
                const inVal = parseFloat(document.getElementById('in-val').value);
                document.getElementById('out-val').value = inVal.toFixed(1);
                calcBreathing('in');
            } else {
                calcBreathing('bpm');
            }
        }

        function toggleSettingsPanel() { document.getElementById('settings-panel').classList.toggle('collapsed'); }
        setTimeout(() => { inputArea.classList.add('faint'); }, 3000);
        inputArea.addEventListener("input", function() { this.style.height = 'auto'; this.style.height = (this.scrollHeight) + "px"; });

        function toggleMirror(type) {
            const cp = document.getElementById('m-p-check');
            const ca = document.getElementById('m-a-check');
            const st = document.getElementById('top-status');
            if (type === 'patient') {
                if (cp.checked) { ca.checked = false; body.classList.remove('mirror-all'); patientWrapper.classList.add('mirror-patient-only'); st.classList.add('mirror-patient-only'); }
                else { patientWrapper.classList.remove('mirror-patient-only'); st.classList.remove('mirror-patient-only'); }
            } else {
                if (ca.checked) { cp.checked = false; patientWrapper.classList.remove('mirror-patient-only'); st.classList.remove('mirror-patient-only'); body.classList.add('mirror-all'); }
                else { body.classList.remove('mirror-all'); }
            }
        }

        // --- INTERDEPENDENT BREATHING LOGIC ---
        function calcBreathing(changedField) {
            let bpm = parseFloat(document.getElementById('bpm-val').value);
            let inSec = parseFloat(document.getElementById('in-val').value);
            let outSec = parseFloat(document.getElementById('out-val').value);
            let total = 60 / bpm;

            if (!splitInOut) {
                // Keep In/Out equal unless user chooses to split them
                if (changedField === 'bpm') {
                    total = 60 / bpm;
                    inSec = outSec = total / 2;
                } else {
                    // In or Out changed; keep both equal and update BPM
                    inSec = outSec = (changedField === 'in' ? inSec : outSec);
                    total = inSec + outSec;
                    bpm = 60 / total;
                }
            } else {
                if (changedField === 'bpm') {
                    // If BPM changes, keep In-time but adjust Out-time to fit new total
                    if (inSec >= total) inSec = total * 0.4; // fallback ratio
                    outSec = total - inSec;
                } else if (changedField === 'in') {
                    // If In changes, adjust Out but keep BPM (Total) the same
                    if (inSec >= total) {
                        total = inSec + 1; // expand total if In is too big
                        bpm = 60 / total;
                    }
                    outSec = total - inSec;
                } else if (changedField === 'out') {
                    // If Out changes, adjust In but keep BPM (Total) the same
                    if (outSec >= total) {
                        total = outSec + 1;
                        bpm = 60 / total;
                    }
                    inSec = total - outSec;
                }
            }

            // Update UI
            document.getElementById('bpm-val').value = bpm.toFixed(1);
            document.getElementById('in-val').value = inSec.toFixed(1);
            document.getElementById('out-val').value = outSec.toFixed(1);

            applySync(bpm, inSec, outSec);
        }

        function applySync(bpm, inSec, outSec) {
            const total = inSec + outSec; // Always use actual in+out cycle for timing
            const peakPercent = (inSec / total) * 100;

            // Preserve current phase of cycle when parameters change
            const now = performance.now();
            let phaseFraction = 0;
            if (lastTotal > 0) {
                const elapsed = (now - cycleStart) % (lastTotal * 1000);
                phaseFraction = elapsed / (lastTotal * 1000);
            }
            cycleStart = now - phaseFraction * (total * 1000);
            lastTotal = total;

            document.documentElement.style.setProperty('--total-cycle', total + 's');

            // Dynamic Keyframes for asymmetric breathing
            let styleTag = document.getElementById('dynamic-animations');
            if (!styleTag) {
                styleTag = document.createElement("style");
                styleTag.id = 'dynamic-animations';
                document.head.appendChild(styleTag);
            }
            styleTag.innerText = `
                @keyframes clinicalBreathe {
                    0%, 100% { transform: scale(0.65); opacity: 0.2; }
                    ${peakPercent}% { transform: scale(1.35); opacity: 0.7; }
                }
                @keyframes bgPulse {
                    0%, 100% { background-color: var(--bg-base); }
                    ${peakPercent}% { background-color: var(--bg-pulse); }
                }
            `;

            // Reset CSS Animations
            patientWrapper.classList.remove('animating');
            void patientWrapper.offsetWidth;
            patientWrapper.classList.add('animating');

            // Sync Text + Pulse Brightness
            if (document.getElementById('text-toggle').checked || document.getElementById('pulse-toggle').checked) {
                startBreathingLoop(inSec * 1000, outSec * 1000, total * 1000);
            } else {
                stopBreathingLoop();
            }
        }

        function stopBreathingLoop() {
            if (breathAnimFrame) {
                cancelAnimationFrame(breathAnimFrame);
                breathAnimFrame = null;
            }
        }

        function startBreathingLoop(inMs, outMs, totalMs) {
            stopBreathingLoop();
            const fadeMs = 300;

            const updateFrame = () => {
                const now = performance.now();
                const elapsed = (now - cycleStart) % totalMs;
                const isInhale = elapsed < inMs;
                const phaseTime = isInhale ? elapsed : elapsed - inMs;
                const phaseDuration = isInhale ? inMs : outMs;

                // Text sync
                const phaseText = isInhale ? 'BREATHE IN' : 'BREATHE OUT';
                if (breathText.innerText !== phaseText) {
                    breathText.innerText = phaseText;
                }

                const fadeStart = phaseDuration - fadeMs;
                let opacity = 1;
                if (phaseTime >= fadeStart) {
                    opacity = Math.max(0.15, 1 - (phaseTime - fadeStart) / fadeMs);
                }
                breathText.style.opacity = opacity;

                // Pulse brightness (brightest at end of inhale, dimmest at end of exhale)
                const progress = phaseTime / phaseDuration;
                const brightness = isInhale ? (0.35 + 0.65 * progress) : (0.35 + 0.65 * (1 - progress));
                pulseCircle.style.filter = `brightness(${brightness})`;

                breathAnimFrame = requestAnimationFrame(updateFrame);
            };

            updateFrame();
        }

        function updatePulseVisibility(v) {
            pulseCircle.style.display = v ? 'block' : 'none';
            body.classList.toggle('pulse-active', v);
            calcBreathing('bpm');
        }

        function updateTextVisibility(v) {
            breathText.style.display = v ? 'block' : 'none';
            calcBreathing('bpm');
        }

        // Timer/Countdown
        let globalInt; let elapsed = 0;
        const topUI = document.getElementById('top-status');
        const timeText = document.getElementById('status-text');
        const progFill = document.getElementById('progress-bar-fill');

        function stopAllTimers() { clearInterval(globalInt); topUI.style.display = 'none'; document.getElementById('progress-bar-container').style.display = 'none'; }
        function startTimer() {
            stopAllTimers(); elapsed = 0; topUI.style.display = 'block';
            globalInt = setInterval(() => { elapsed++; let m = Math.floor(elapsed/60).toString().padStart(2,'0'); let s = (elapsed%60).toString().padStart(2,'0'); timeText.innerText = `${m}:${s}`; }, 1000);
        }
        function startCountdown() {
            stopAllTimers(); let total = parseInt(document.getElementById('cd-val').value); let rem = total;
            topUI.style.display = 'block'; document.getElementById('progress-bar-container').style.display = 'block';
            globalInt = setInterval(() => { rem--; let m = Math.floor(rem/60).toString().padStart(2,'0'); let s = (rem%60).toString().padStart(2,'0'); timeText.innerText = `${m}:${s}`; progFill.style.width = ((total-rem)/total*100)+'%'; if(rem <= 0) stopAllTimers(); }, 1000);
        }

        // Scale
        const zs = document.getElementById('zoom-select');
        for(let i=30; i<=150; i+=10){ let o=document.createElement('option'); o.value=i/100; o.innerText=i+'%'; if(i==100)o.selected=true; zs.appendChild(o); }
        function updateScale(v) { document.documentElement.style.setProperty('--scale-factor', v); document.body.style.overflow = (v > 1) ? 'auto' : 'hidden'; if (v <= 1) window.scrollTo(0,0); }

        calcBreathing('bpm');
    </script>
</body>
</html>
