<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MRI Breathing Instructions</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body id="mainBody">

<div id="settings-panel" class="collapsed">
    <span id="settings-toggle" onclick="toggleSettingsPanel()">⚙️</span>
    <div id="settings-content">
        <div class="control-row">
            <label>Zoom: </label>
            <select id="zoom-select" onchange="updateScale(this.value)"></select>
        </div>
        <hr style="border:0; border-top:1px solid #333">
        <div class="control-row">
            <input type="checkbox" id="m-p-check" onchange="toggleMirror('patient')">
            <label for="m-p-check">Mirror Patient Only</label>
        </div>
        <div class="control-row">
            <input type="checkbox" id="m-a-check" onchange="toggleMirror('all')">
            <label for="m-a-check">Mirror Everything</label>
        </div>
    </div>
</div>

<div id="helpModal" class="modal-overlay">
  <div class="modal-content">
    <h2 style="margin-top:0; color:var(--accent)">Instructions</h2>
    <div id="instructionText" contenteditable="false"></div>
    <div class="modal-actions">
      <button id="editHelpBtn" style="background:var(--warning); color:black">EDIT</button>
      <button id="closeHelpBtn" style="background:var(--accent); color:black">CLOSE</button>
    </div>
  </div>
</div>

<div id="scaling-layer">
  <div class="app-container">
    
    <header>
      <h1>MRI Breathe Instruction</h1>
      <div style="display:flex; gap:15px; align-items:center">
          <button id="openHelpBtn" class="btn-help">HELP</button>
          <div id="cycleInfo">Cycle 0/0</div>
      </div>
    </header>

    <main id="mirror-layer" class="display">
      <div id="phaseSquare" class="phase-square">
          <div id="stepText" class="step">Ready</div>
          <div id="countdown" class="countdown">00s</div>
      </div>
    </main>

    <div class="progress"><i id="progressBar"></i></div>

    <footer class="bottom-shelf">
      <form class="controls-row" onsubmit="return false">
        <div class="input-group"><label>Reps</label><input id="reps" type="number" value="1" /></div>
        <div class="input-group"><label>Inhale</label><input id="inhale" type="number" value="2" /></div>
        <div class="input-group"><label>Hold</label><input id="hold" type="number" value="20" /></div>
        <div class="input-group"><label>Recovery</label><input id="recovery" type="number" value="18" /></div>
        <div class="input-group">
          <label>Alert</label>
          <select id="alertSpeed">
              <option value="2">Slow</option>
              <option value="1">Medium</option>
              <option value="0.4">Fast</option>
          </select>
        </div>

        <div class="actions" style="display:flex; gap: 8px; margin-left: 10px;">
          <button id="attnBtn" class="btn-attention">ATTENTION</button>
          <button id="startBtn" class="btn-start">START</button>
          <button id="stopBtn" class="btn-stop" disabled>STOP</button>
        </div>
      </form>
    </footer>

  </div>
</div>

<script>
(function(){
  const body = document.getElementById('mainBody');
  const phaseSquare = document.getElementById('phaseSquare');
  const stepText = document.getElementById('stepText');
  const countdown = document.getElementById('countdown');
  const progressBar = document.getElementById('progressBar');
  const cycleInfo = document.getElementById('cycleInfo');
  
  // UI Controls
  const attnBtn = document.getElementById('attnBtn');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  
  // Modal Elements
  const helpModal = document.getElementById('helpModal');
  const helpDisplay = document.getElementById('instructionText');
  const openHelpBtn = document.getElementById('openHelpBtn');
  const editHelpBtn = document.getElementById('editHelpBtn');
  const closeHelpBtn = document.getElementById('closeHelpBtn');

  const defaultInstructions = `ON THE MRI SCANNER:
1. Right-click on all breath-hold sequences.
2. Select "Edit properties".
3. Navigate to "Voice commands" and select "Short hold breath".
4. Note the pause duration for sequences with more than one breath hold.
5. Navigate to "Execution" and select "Wait for User to Start".

RECOMMENDED APP SETTINGS:
- Inhale time: 2 seconds.
- Recovery time: Add 3 seconds for sequences with multiple breath holds (e.g., if the scanner pause is 15s, use 18s).`;

  let state = { running: false, stopRequested: false };
  let isEditing = false;

  // Initialize Help
  const savedHelp = localStorage.getItem('mri_help_text');
  helpDisplay.innerText = savedHelp || defaultInstructions;

  function setTint(color) {
    const colors = { yellow: 'rgba(250, 204, 21, 0.15)', red: 'rgba(251, 113, 133, 0.2)', green: 'rgba(74, 222, 128, 0.2)', none: 'rgba(0,0,0,0)' };
    phaseSquare.style.backgroundColor = colors[color];
  }

  async function runTimer(duration, label, tint) {
    let remaining = duration;
    setTint(tint);
    while (remaining > 0 && !state.stopRequested) {
      stepText.textContent = label;
      countdown.textContent = `${Math.ceil(remaining)}s`;
      progressBar.style.width = `${(1 - remaining/duration) * 100}%`;
      remaining -= 0.1;
      await new Promise(r => setTimeout(r, 100));
    }
  }

  startBtn.onclick = async () => {
    state.running = true; state.stopRequested = false;
    const reps = +document.getElementById('reps').value;
    const inhale = +document.getElementById('inhale').value;
    const hold = +document.getElementById('hold').value;
    const recovery = +document.getElementById('recovery').value;
    
    startBtn.disabled = true; stopBtn.disabled = false;
    body.classList.remove('attending');

    for (let i = 1; i <= reps; i++) {
      if (state.stopRequested) break;
      cycleInfo.textContent = `Cycle ${i}/${reps}`;
      await runTimer(inhale, "Inhale", 'yellow');
      await runTimer(hold, "Hold Breath", 'red');
      if (i < reps) await runTimer(recovery, "Prepare for next breath hold", 'yellow');
    }
    
    state.running = false;
    startBtn.disabled = false; stopBtn.disabled = true;
    stepText.textContent = "Breathe normally";
    setTint('green');
    countdown.textContent = "00s";
    progressBar.style.width = "0%";
  };

  stopBtn.onclick = () => {
    state.stopRequested = true;
    body.classList.remove('attending');
    if (!state.running) stopBtn.disabled = true;
  };

  // ATTENTION BUTTON TOGGLE LOGIC
  attnBtn.onclick = () => { 
    const isAttending = body.classList.toggle('attending'); 
    if (isAttending) {
        stopBtn.disabled = false;
    } else {
        if (!state.running) stopBtn.disabled = true;
    }
  };

  // Modal Logic
  openHelpBtn.onclick = () => helpModal.style.display = 'flex';
  closeHelpBtn.onclick = () => {
    helpModal.style.display = 'none';
    if(isEditing) toggleEdit();
  };

  function toggleEdit() {
    isEditing = !isEditing;
    helpDisplay.contentEditable = isEditing;
    editHelpBtn.innerText = isEditing ? "SAVE" : "EDIT";
    if (!isEditing) {
      localStorage.setItem('mri_help_text', helpDisplay.innerText);
    }
    helpDisplay.style.background = isEditing ? "rgba(255,255,255,0.1)" : "rgba(0,0,0,0.3)";
  }

  editHelpBtn.onclick = toggleEdit;

  document.getElementById('alertSpeed').onchange = (e) => {
    document.documentElement.style.setProperty('--flash-duration', e.target.value + 's');
  };
})();

// --- TOOLBOX LOGIC ---
const scalingLayer = document.getElementById('scaling-layer');
const mirrorLayer = document.getElementById('mirror-layer');
const bodyEl = document.getElementById('mainBody');

function toggleSettingsPanel() { document.getElementById('settings-panel').classList.toggle('collapsed'); }

function toggleMirror(type) {
    const cp = document.getElementById('m-p-check');
    const ca = document.getElementById('m-a-check');
    
    if (type === 'patient') {
        if (cp.checked) {
            ca.checked = false;
            bodyEl.classList.remove('mirror-all');
            mirrorLayer.classList.add('mirror-patient-active');
        } else {
            mirrorLayer.classList.remove('mirror-patient-active');
        }
    } else {
        if (ca.checked) {
            cp.checked = false;
            mirrorLayer.classList.remove('mirror-patient-active');
            bodyEl.classList.add('mirror-all');
        } else {
            bodyEl.classList.remove('mirror-all');
        }
    }
}

// Zoom Populator
const zoomSelect = document.getElementById('zoom-select');
for (let i = 30; i <= 150; i += 10) {
    let opt = document.createElement('option');
    opt.value = i / 100;
    opt.innerHTML = i + '%';
    if (i === 100) opt.selected = true;
    zoomSelect.appendChild(opt);
}

function updateScale(val) {
    document.documentElement.style.setProperty('--scale-factor', val);
}

</script>
</body>
</html>
