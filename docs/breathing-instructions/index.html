<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MRI Breathing Instructions</title>
  <style>
    :root {
      --bg: #000000;
      --accent: #60a5fa;
      --muted: #94a3b8;
      --text: #ffffff;
      --danger: #fb7185;
      --warning: #facc15;
      --success: #4ade80;
      --panel-bg: #1e293b;
      --flash-duration: 2s;

      --tint-none: rgba(0, 0, 0, 0);
      --tint-yellow: rgba(250, 204, 21, 0.15);
      --tint-red: rgba(251, 113, 133, 0.2);
      --tint-green: rgba(74, 222, 128, 0.2);

      --scale-factor: 1.0;
      --accent-teal: #94d2bd;
      --instr-scale: 1.0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    /* Flash Alert */
    @keyframes attentionFlash {
      0% {
        background-color: #ffffff;
      }

      33% {
        background-color: #ff6363;
      }

      66% {
        background-color: #000000;
      }

      100% {
        background-color: #ffffff;
      }
    }

    body.attending {
      animation: attentionFlash var(--flash-duration) infinite;
    }

    /* --- MIRRORING ENGINE --- */
    .mirror-all {
      transform: scaleX(-1);
    }

    .mirror-patient-active {
      transform: scaleX(-1);
    }

    /* Instruction Area */
    #instruction-input {
      z-index: 1005;
      width: 90%;
      background: transparent;
      border: none;
      color: #fff;
      font-size: calc(clamp(2rem, 8vh, 5.5rem) * var(--instr-scale, 1));
      font-weight: 800;
      text-align: center;
      text-transform: uppercase;
      outline: none;
      resize: none;
      overflow: hidden;
      display: none;
      margin: 0 auto;
      padding: 0;
      line-height: 1;
      flex-shrink: 0;
    }

    #instruction-input::placeholder {
      color: var(--accent-teal);
      transition: color 0.5s ease;
    }

    #instruction-input.faint::placeholder {
      color: rgba(255, 255, 255, 0.05);
    }

    /* --- TOOLBOX STYLES --- */
    #settings-panel {
      position: fixed;
      top: 70px;
      right: 15px;
      max-height: calc(100vh - 85px);
      overflow-y: auto;
      z-index: 3000;
      background: rgba(0, 0, 0, 0.9);
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px;
      transition: all 0.3s ease;
    }

    #settings-panel.collapsed {
      background: transparent;
      border: none;
      padding: 0;
    }

    #settings-content {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
      font-size: 0.8rem;
    }

    .collapsed #settings-content {
      display: none;
    }

    #settings-toggle {
      cursor: pointer;
      font-size: 24px;
      color: var(--accent-teal);
      display: inline-block;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .control-row select {
      background: #222;
      color: white;
      border: 1px solid #666;
      padding: 4px;
      border-radius: 4px;
      width: auto;
    }

    /* --- WRAPPERS FOR SCALE/MIRROR --- */
    #scaling-layer {
      transform: scale(var(--scale-factor));
      transform-origin: top center;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #mirror-layer {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease;
      min-height: 0;
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: var(--panel-bg);
      width: 90%;
      max-width: 600px;
      padding: 30px;
      border-radius: 20px;
      border: 2px solid var(--accent);
      position: relative;
      box-shadow: 0 0 50px rgba(0, 0, 0, 1);
    }

    #instructionText {
      width: 100%;
      min-height: 300px;
      background: rgba(0, 0, 0, 0.3);
      color: white;
      border: 1px solid #475569;
      padding: 15px;
      border-radius: 10px;
      font-size: clamp(12px, 2vmin, 16px);
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      justify-content: flex-end;
    }

    /* App Container & Fluid Layout */
    .app-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      width: 100%;
      padding: 20px 30px;
      position: relative;
      z-index: 1;
      min-height: 0;
    }

    header h1 {
      margin: 0;
      font-size: clamp(1rem, 2vw, 1.4rem);
    }

    .display {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      width: 100%;
      min-height: 0;
    }

    .phase-square {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 1/1;
      background: var(--tint-none);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      transition: background-color 0.5s ease;
      backdrop-filter: blur(2px);
      flex: 1;
      min-height: 0;
      box-sizing: border-box;
    }

    /* Core scaling for main display text */
    .step {
      font-size: clamp(30px, 8vmin, 85px);
      font-weight: 900;
      margin-bottom: 1vh;
      text-shadow: 2px 2px 15px #000;
    }

    .countdown {
      font-size: clamp(50px, 15vmin, 130px);
      font-weight: 200;
      font-variant-numeric: tabular-nums;
    }

    .progress {
      height: clamp(20px, 4vh, 40px);
      background: rgba(0, 0, 0, 0.6);
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.3);
      margin-top: 30px;
      margin-bottom: 20px;
      flex-shrink: 0;
    }

    .progress>i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      width: 0%;
      transition: width 0.1s linear;
    }

    /* Toolbar Elements */
    #bottom-toolbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      box-sizing: border-box;
      background: #050505;
      border-top: 1px solid #222;
      z-index: 2001;
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 10px;
      flex-shrink: 0;
    }

    .toolbar-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .val-label {
      font-size: 0.7rem;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: bold;
    }

    input[type="number"] {
      background: #111;
      color: var(--accent);
      border: 1px solid #444;
      padding: 5px;
      border-radius: 4px;
      font-weight: bold;
      text-align: center;
      width: 55px;
      font-size: 14px;
    }

    select {
      background: #111;
      color: var(--accent);
      border: 1px solid #444;
      padding: 5px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 14px;
    }

    button {
      background: #222;
      color: white;
      border: 1px solid #444;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.8rem;
    }

    button:hover {
      background: #333;
      border-color: #666;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-attention {
      color: var(--warning);
    }

    .btn-start {
      color: var(--accent);
    }

    .btn-stop {
      color: var(--danger);
    }
  </style>
  <script src="../header.js"></script>
</head>

<body id="mainBody">
  <mri-header root="../"></mri-header>

  <div id="settings-panel" class="collapsed">
    <div id="settings-content">
      <div class="control-row">
        <label>Zoom: </label>
        <select id="zoom-select" onchange="updateScale(this.value)"></select>
      </div>
      <hr style="border:0; border-top:1px solid #333">
      <div class="control-row">
        <input type="checkbox" id="m-p-check" onchange="toggleMirror('patient')">
        <label for="m-p-check">Mirror Patient Only</label>
      </div>
      <div class="control-row">
        <input type="checkbox" id="m-a-check" onchange="toggleMirror('all')">
        <label for="m-a-check">Mirror Everything</label>
      </div>

      <hr style="border:0; border-top:1px solid #333; margin: 10px 0;">
      <div style="font-size: 0.6rem; color: #666; text-align: center; line-height: 1.4;">
        Tools created by <br>
        <a href="https://www.linkedin.com/in/giuseppepalminteri" target="_blank"
          style="color:#94d2bd; text-decoration: none; font-weight: bold;">
          Giuseppe Palminteri
        </a>
      </div>
    </div>
  </div>


  <div id="scaling-layer">
    <div class="app-container">

      <main id="mirror-layer" class="display">
        <textarea id="instruction-input" placeholder="CLICK HERE TO TYPE INSTRUCTIONS" rows="1"></textarea>
        <div id="phaseSquare" class="phase-square">
          <div id="stepText" class="step">Ready</div>
          <div id="countdown" class="countdown">00s</div>
        </div>
      </main>

      <div class="progress"><i id="progressBar"></i></div>

    </div>
  </div>

  <div id="bottom-toolbar">
    <form class="toolbar-row" onsubmit="return false">
      <div class="tool-group">
          <input type="checkbox" id="instr-check" onchange="toggleInstr()">
          <label for="instr-check" class="val-label" style="text-transform: none;">Text Instructions</label>
      </div>
      <div class="tool-group" id="instr-size-grp" style="opacity: 0.4; pointer-events: none;">
          <span class="val-label">Instr. Size:</span>
          <input type="range" id="instr-size-slider" min="50" max="150" value="100" style="width: 80px;" oninput="changeInstrSize(this.value)">
      </div>
      <div class="tool-group" id="instr-clear-grp" style="opacity: 0.4; pointer-events: none;">
        <button onclick="document.getElementById('instruction-input').value = ''">Clear Text</button>
      </div>
      <div class="tool-group" style="margin-left: 10px; border-left: 1px solid #333; padding-left: 20px;">
        <span class="val-label">Pattern</span>
        <select id="patternType">
          <option value="in">Breathe IN Hold</option>
          <option value="out">Breathe OUT Hold</option>
        </select>
      </div>
      <div class="tool-group"><span class="val-label">Reps</span><input id="reps" type="number" value="1" /></div>
      <div class="tool-group"><span class="val-label" id="inhaleLabel">Inhale</span><input id="inhale" type="number"
          value="2" /></div>
      <div class="tool-group"><span class="val-label">Hold</span><input id="hold" type="number" value="20" /></div>
      <div class="tool-group"><span class="val-label">Recovery</span><input id="recovery" type="number" value="18" />
      </div>
      <div class="tool-group">
        <span class="val-label">Alert</span>
        <select id="alertSpeed">
          <option value="2">Slow</option>
          <option value="1">Medium</option>
          <option value="0.4">Fast</option>
        </select>
      </div>

      <div class="tool-group" style="margin-left: 20px; border-left: 1px solid #333; padding-left: 20px;">
        <button id="attnBtn" class="btn-attention">ATTENTION</button>
        <div style="text-align: center; display: flex; flex-direction: column; align-items: center;">
          <button id="startBtn" class="btn-start">START</button>
          <div style="font-size: 0.6rem; color: #777; margin-top: 2px; font-weight: bold;">SPACE</div>
        </div>
        <div style="text-align: center; display: flex; flex-direction: column; align-items: center;">
          <button id="stopBtn" class="btn-stop" disabled>STOP</button>
          <div style="font-size: 0.6rem; color: #777; margin-top: 2px; font-weight: bold;">ENTER</div>
        </div>
      </div>
    </form>
  </div>

  <script>
    (function () {
      const body = document.getElementById('mainBody');
      const phaseSquare = document.getElementById('phaseSquare');
      const stepText = document.getElementById('stepText');
      const countdown = document.getElementById('countdown');
      const progressBar = document.getElementById('progressBar');
      const mriHeader = document.querySelector('mri-header');

      // UI Controls
      const attnBtn = document.getElementById('attnBtn');
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');

      let state = { running: false, stopRequested: false, phase: 'idle' };

      function updateAttentionButton() {
        if (!state.running || state.phase === 'recovery' || state.phase === 'idle') {
          attnBtn.disabled = false;
        } else {
          attnBtn.disabled = true;
        }
      }

      function setTint(color) {
        const colors = { yellow: 'rgba(250, 204, 21, 0.15)', red: 'rgba(251, 113, 133, 0.2)', green: 'rgba(74, 222, 128, 0.2)', none: 'rgba(0,0,0,0)' };
        phaseSquare.style.backgroundColor = colors[color];
      }

      async function runTimer(duration, label, tint) {
        setTint(tint);
        stepText.innerHTML = label;
        
        return new Promise(resolve => {
            const startTime = performance.now();
            const durationMs = duration * 1000;
            
            function tick(now) {
                if (state.stopRequested) {
                    resolve();
                    return;
                }
                
                const elapsed = now - startTime;
                const remaining = Math.max(0, duration - (elapsed / 1000));
                
                countdown.textContent = `${Math.ceil(remaining)}s`;
                progressBar.style.width = `${(elapsed / durationMs) * 100}%`;
                
                if (elapsed < durationMs) {
                    requestAnimationFrame(tick);
                } else {
                    resolve();
                }
            }
            
            requestAnimationFrame(tick);
        });
      }

      startBtn.onclick = async () => {
        state.running = true; state.stopRequested = false; state.phase = 'idle';
        updateAttentionButton();
        const reps = +document.getElementById('reps').value;
        const inhale = +document.getElementById('inhale').value;
        const hold = +document.getElementById('hold').value;
        const recovery = +document.getElementById('recovery').value;
        const pattern = document.getElementById('patternType').value;

        startBtn.disabled = true; stopBtn.disabled = false;
        body.classList.remove('attending');

        const inhaleText = pattern === 'in' ? "Inhale" : "Inhale and<br>Breathe Out";
        const holdText = pattern === 'in' ? "Hold Breath" : "Hold Breath Out";

        for (let i = 1; i <= reps; i++) {
          if (state.stopRequested) break;
          if (reps > 1) {
            mriHeader.setStatusText(`Cycle ${i}/${reps}`);
          } else {
            mriHeader.setStatusText('');
          }
          
          state.phase = 'inhale';
          updateAttentionButton();
          await runTimer(inhale, inhaleText, 'yellow');
          
          if (state.stopRequested) break;
          
          state.phase = 'hold';
          updateAttentionButton();
          await runTimer(hold, holdText, 'red');
          
          if (i < reps) {
            if (state.stopRequested) break;
            state.phase = 'recovery';
            updateAttentionButton();
            await runTimer(recovery, "Prepare for next breath hold", 'yellow');
          }
        }

        state.running = false;
        state.phase = 'idle';
        updateAttentionButton();
        startBtn.disabled = false; stopBtn.disabled = true;
        mriHeader.setStatusText('');
        stepText.textContent = "Breathe normally";
        setTint('green');
        countdown.textContent = "00s";
        progressBar.style.width = "0%";
      };

      stopBtn.onclick = () => {
        state.stopRequested = true;
        state.phase = 'idle';
        updateAttentionButton();
        mriHeader.setStatusText('');
        body.classList.remove('attending');
        if (!state.running) stopBtn.disabled = true;
      };

      // ATTENTION BUTTON TOGGLE LOGIC
      attnBtn.onclick = () => {
        const isAttending = body.classList.toggle('attending');
        if (isAttending) {
          stopBtn.disabled = false;
        } else {
          if (!state.running) stopBtn.disabled = true;
        }
      };

      document.getElementById('patternType').addEventListener('change', (e) => {
        const val = e.target.value;
        if (val === 'in') {
          document.getElementById('inhaleLabel').innerHTML = 'Inhale';
          document.getElementById('hold').value = 20; // reset to original default if switched back
          document.getElementById('inhale').value = 2;
        } else {
          document.getElementById('inhaleLabel').innerHTML = 'Inhale and<br>Breathe Out';
          document.getElementById('hold').value = 5; // User requested default 5s
          document.getElementById('inhale').value = 5;
        }
      });

      document.getElementById('alertSpeed').onchange = (e) => {
        document.documentElement.style.setProperty('--flash-duration', e.target.value + 's');
      };

      // Keyboard Controls
      document.addEventListener('keydown', (e) => {
        // Only ignore shortcuts when typing in the instruction text area
        if (e.target === document.getElementById('instruction-input')) {
          return;
        }

        if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') {
          // If a form element is focused, blur it so the shortcut takes effect
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'TEXTAREA') {
            e.target.blur();
          }

          if (e.code === 'Space') {
            e.preventDefault(); // Prevent page scrolling
            if (!startBtn.disabled) {
              startBtn.click();
            }
          } else if (e.code === 'Enter' || e.code === 'NumpadEnter') {
            if (!stopBtn.disabled) {
              stopBtn.click();
            }
          }
        }
      });
    })();

    // --- TOOLBOX LOGIC ---
    const scalingLayer = document.getElementById('scaling-layer');
    const mirrorLayer = document.getElementById('mirror-layer');
    const bodyEl = document.getElementById('mainBody');

    function toggleSettingsPanel() { document.getElementById('settings-panel').classList.toggle('collapsed'); }

    function toggleMirror(type) {
      const cp = document.getElementById('m-p-check');
      const ca = document.getElementById('m-a-check');

      if (type === 'patient') {
        if (cp.checked) {
          ca.checked = false;
          bodyEl.classList.remove('mirror-all');
          mirrorLayer.classList.add('mirror-patient-active');
        } else {
          mirrorLayer.classList.remove('mirror-patient-active');
        }
      } else {
        if (ca.checked) {
          cp.checked = false;
          mirrorLayer.classList.remove('mirror-patient-active');
          bodyEl.classList.add('mirror-all');
          if (window.parent !== window) window.parent.postMessage({ type: 'SET_MIRROR_ALL', active: true }, '*');
        } else {
          bodyEl.classList.remove('mirror-all');
          if (window.parent !== window) window.parent.postMessage({ type: 'SET_MIRROR_ALL', active: false }, '*');
        }
      }
    }

    // Zoom Populator
    const zoomSelect = document.getElementById('zoom-select');
    for (let i = 30; i <= 150; i += 10) {
      let opt = document.createElement('option');
      opt.value = i / 100;
      opt.innerHTML = i + '%';
      if (i === 100) opt.selected = true;
      zoomSelect.appendChild(opt);
    }

    function updateScale(val) {
      document.documentElement.style.setProperty('--scale-factor', val);
    }

    function toggleInstr() {
        const isChecked = document.getElementById('instr-check').checked;
        const el = document.getElementById('instruction-input');
        if (el) {
            el.style.display = isChecked ? 'block' : 'none';
            if (isChecked) {
                el.classList.remove('faint');
                if (window.instrTimeout) clearTimeout(window.instrTimeout);
                window.instrTimeout = setTimeout(() => { el.classList.add('faint'); }, 3000);
                // Force resize to fit placeholder
                setTimeout(() => {
                    el.style.height = 'auto'; 
                    el.style.height = (el.scrollHeight) + "px";
                }, 0);
            }
        }
        const clearGrp = document.getElementById('instr-clear-grp');
        if (clearGrp) { clearGrp.style.opacity = isChecked ? '1' : '0.4'; clearGrp.style.pointerEvents = isChecked ? 'auto' : 'none'; }
        const sizeGrp = document.getElementById('instr-size-grp');
        if (sizeGrp) { sizeGrp.style.opacity = isChecked ? '1' : '0.4'; sizeGrp.style.pointerEvents = isChecked ? 'auto' : 'none'; }
    }
    function changeInstrSize(val) {
        document.documentElement.style.setProperty('--instr-scale', val / 100);
        const inputArea = document.getElementById('instruction-input');
        if (inputArea) {
            inputArea.style.height = 'auto'; 
            inputArea.style.height = (inputArea.scrollHeight) + "px";
        }
    }
    
    // Use the existing inputArea variable locally scoped or attach it like so:
    const instrArea = document.getElementById('instruction-input');
    if (instrArea) {
        instrArea.addEventListener("input", function () { this.style.height = 'auto'; this.style.height = (this.scrollHeight) + "px"; });
        
        // Prevent hotkeys from triggering while typing instructions
        instrArea.addEventListener('keydown', function(e) {
          if(e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') {
            e.stopPropagation();
          }
        });
    }

  </script>
</body>

</html>
